<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEYCODE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #06060e;
  --bg2: #0c0c18;
  --bg3: #14142a;
  --border: rgba(99,102,241,0.12);
  --text: #e8e8f0;
  --text2: rgba(255,255,255,0.5);
  --accent: #ffffff;
  --accent2: #a3a3a3;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --radius: 12px;
  --font: 'Inter', sans-serif;
  --display: 'Syne', 'Inter', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
}
/* ===== LOGIN ===== */
#login-view {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px;
  background: radial-gradient(ellipse at 50% 0%, rgba(99,102,241,0.08) 0%, transparent 60%),
              var(--bg);
}
#login-view.hidden { display: none; }
.login-card {
  width: 100%; max-width: 400px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; padding: 40px 32px;
}
.login-card h1 {
  font-family: var(--display); font-size: 24px; font-weight: 700;
  text-align: center; margin-bottom: 4px;
}
.login-card p {
  text-align: center; color: var(--text2); font-size: 14px; margin-bottom: 28px;
}
.login-card .brand {
  text-align: center; font-family: var(--display); font-size: 13px;
  letter-spacing: 0.3em; text-transform: uppercase;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 24px;
}
.login-error {
  background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2);
  color: var(--danger); padding: 10px 14px; border-radius: 8px;
  font-size: 13px; margin-bottom: 16px; display: none;
}
.login-error.show { display: block; }
.input-group { margin-bottom: 16px; }
.input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
.input-group input {
  width: 100%; padding: 12px 14px; background: var(--bg3);
  border: 1px solid var(--border); border-radius: 8px; color: var(--text);
  font-size: 14px; font-family: var(--font); outline: none;
  transition: border-color 0.2s;
}
.input-group input:focus { border-color: var(--accent); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600;
  cursor: pointer; border: none; font-family: var(--font);
  transition: all 0.2s; text-decoration: none;
}
.btn-primary { background: var(--accent); color: #fff; width: 100%; }
.btn-primary:hover { background: #5558e6; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text2); }
.btn-ghost:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.btn-sm { padding: 8px 14px; font-size: 13px; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #059669; }
/* ===== ADMIN LAYOUT ===== */
#admin-view { display: none; }
#admin-view.active { display: flex; height: 100vh; }
.sidebar {
  width: 240px; background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
}
.sidebar-header {
  padding: 20px 16px; border-bottom: 1px solid var(--border);
  font-family: var(--display); font-size: 14px; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase;
  display: flex; align-items: center; gap: 10px;
}
.sidebar-header .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--success);
  flex-shrink: 0;
}
.sidebar-nav { flex: 1; padding: 8px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 500;
  color: var(--text2); cursor: pointer; transition: all 0.15s;
  margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left;
  font-family: var(--font);
}
.nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.nav-item.active { background: rgba(99,102,241,0.12); color: var(--accent); }
.nav-item i { width: 18px; text-align: center; font-size: 14px; }
.nav-divider { height: 1px; background: var(--border); margin: 8px 0; }
.nav-bottom { padding: 8px; border-top: 1px solid var(--border); }
.main-content { flex: 1; overflow-y: auto; padding: 28px; background: var(--bg); }
.page-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
}
.page-header h1 { font-family: var(--display); font-size: 22px; font-weight: 700; }
.page-header .subtitle { font-size: 13px; color: var(--text2); margin-top: 4px; }
/* ===== STATS GRID ===== */
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px; margin-bottom: 24px;
}
.stat-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
}
.stat-card .icon {
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; margin-bottom: 12px;
}
.stat-card .value { font-size: 24px; font-weight: 700; }
.stat-card .label { font-size: 12px; color: var(--text2); margin-top: 2px; }
.stat-card .change { font-size: 12px; margin-top: 4px; }
.stat-card .change.up { color: var(--success); }
.stat-card .change.down { color: var(--danger); }
/* ===== SECTIONS ===== */
.page-section { display: none; }
.page-section.active { display: block; }
.card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
}
.card-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px;
}
.card-title { font-size: 15px; font-weight: 600; }
/* ===== TABLE ===== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
th { color: var(--text2); font-size: 11px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em; }
td { color: var(--text); }
tr:hover td { background: rgba(255,255,255,0.02); }
/* ===== BADGES ===== */
.badge {
  display: inline-flex; padding: 4px 10px; border-radius: 6px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
}
.badge-info { background: rgba(99,102,241,0.12); color: var(--accent); }
.badge-success { background: rgba(16,185,129,0.12); color: var(--success); }
.badge-warning { background: rgba(245,158,11,0.12); color: var(--warning); }
.badge-danger { background: rgba(239,68,68,0.12); color: var(--danger); }
.badge-default { background: rgba(255,255,255,0.06); color: var(--text2); }
/* ===== FORMS ===== */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
.form-control {
  width: 100%; padding: 10px 12px; background: var(--bg3);
  border: 1px solid var(--border); border-radius: 8px; color: var(--text);
  font-size: 13px; font-family: var(--font); outline: none;
  transition: border-color 0.2s;
}
.form-control:focus { border-color: var(--accent); }
select.form-control { cursor: pointer; }
textarea.form-control { resize: vertical; min-height: 80px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
/* ===== SEARCH ===== */
.search-bar {
  display: flex; gap: 10px; margin-bottom: 16px; align-items: center;
}
.search-bar input {
  flex: 1; padding: 10px 14px; background: var(--bg3);
  border: 1px solid var(--border); border-radius: 8px; color: var(--text);
  font-size: 13px; outline: none; font-family: var(--font);
}
.search-bar input:focus { border-color: var(--accent); }
/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px); z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal {
  width: 100%; max-width: 520px; max-height: 80vh; overflow-y: auto;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; padding: 24px;
}
.modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.modal-close {
  float: right; background: none; border: none; color: var(--text2);
  font-size: 20px; cursor: pointer;
}
.modal-close:hover { color: var(--text); }
/* ===== TOAST ===== */
.toast-container {
  position: fixed; top: 20px; right: 20px; z-index: 2000;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 12px 18px; border-radius: 8px; font-size: 13px; font-weight: 500;
  background: var(--bg2); border: 1px solid var(--border); color: var(--text);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  animation: slideIn 0.25s ease;
  display: flex; align-items: center; gap: 10px;
}
.toast.success { border-color: rgba(16,185,129,0.3); }
.toast.error { border-color: rgba(239,68,68,0.3); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
/* ===== EMPTY STATE ===== */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
.empty-state i { font-size: 32px; margin-bottom: 12px; opacity: 0.3; }
.empty-state p { font-size: 14px; }
/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .sidebar { width: 56px; }
  .sidebar-header span, .nav-item span, .nav-bottom .nav-item span { display: none; }
  .sidebar-header { justify-content: center; }
  .nav-item { justify-content: center; padding: 10px; }
  .main-content { padding: 16px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .form-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="login-view">
  <div class="login-card">
    <div class="brand">KEYCODE</div>
    <h1>Admin Panel</h1>
    <p>Sign in with your admin account</p>
    <div class="login-error" id="login-error"></div>
    <form id="login-form">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="admin@keycode.studio" required autocomplete="email">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">Sign In</button>
    </form>
  </div>
</div>

<div id="admin-view">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="dot"></div>
      <span>KEYCODE Admin</span>
    </div>
    <div class="sidebar-nav">
      <button class="nav-item active" data-section="dashboard"><i class="fas fa-chart-simple"></i><span>Dashboard</span></button>
      <button class="nav-item" data-section="orders"><i class="fas fa-shopping-cart"></i><span>Orders</span></button>
      <button class="nav-item" data-section="users"><i class="fas fa-users"></i><span>Users</span></button>
      <button class="nav-item" data-section="payments"><i class="fas fa-credit-card"></i><span>Payments</span></button>
      <button class="nav-item" data-section="subscriptions"><i class="fas fa-repeat"></i><span>Subscriptions</span></button>
      <div class="nav-divider"></div>
      <button class="nav-item" data-section="tickets"><i class="fas fa-life-ring"></i><span>Support</span></button>
      <button class="nav-item" data-section="reviews"><i class="fas fa-star"></i><span>Reviews</span></button>
      <button class="nav-item" data-section="notifications"><i class="fas fa-bell"></i><span>Notifications</span></button>
      <div class="nav-divider"></div>
      <button class="nav-item" data-section="config"><i class="fas fa-cog"></i><span>Config</span></button>
      <button class="nav-item" data-section="backups"><i class="fas fa-database"></i><span>Backups</span></button>
      <button class="nav-item" data-section="audit"><i class="fas fa-clipboard-list"></i><span>Audit Log</span></button>
      <div class="nav-divider"></div>
      <button class="nav-item" data-section="coupons"><i class="fas fa-ticket"></i><span>Coupons</span></button>
      <button class="nav-item" data-section="ai-models"><i class="fas fa-brain"></i><span>AI Models</span></button>
      <button class="nav-item" data-section="tools"><i class="fas fa-toolbox"></i><span>Active Tools</span></button>
      <button class="nav-item" data-section="projects"><i class="fas fa-folder"></i><span>Projects</span></button>
      <button class="nav-item" data-section="sessions"><i class="fas fa-signal"></i><span>Live Sessions</span></button>
    </div>
    <div class="nav-bottom">
      <button class="nav-item" id="logout-btn"><i class="fas fa-sign-out-alt"></i><span>Sign Out</span></button>
    </div>
  </div>
  <div class="main-content" id="main-content">
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ===== SUPABASE INIT =====
const SUPABASE_URL = 'https://febsgkgfyulhnxucobzk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlYnNna2dmeXVsaG54dWNvYnprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2MjA3ODQsImV4cCI6MjEwMDE5Njc4NH0.kB_R_f49zgYbUUJmWmAp_u67xX0_kByleMJnYPsiAlU';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true },
  realtime: { params: { eventsPerSecond: 10 } }
});

// ===== STATE =====
let currentUser = null;
let currentSection = 'dashboard';
let subscriptions = [];
let ordersCache = [];
let usersCache = [];
let paymentsCache = [];

// ===== UTILITY =====
function $(id) { return document.getElementById(id); }
function qs(sel, ctx) { return (ctx || document).querySelector(sel); }
function qsa(sel, ctx) { return (ctx || document).querySelectorAll(sel); }
function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function formatDate(d) { if (!d) return '-'; return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
function formatDateTime(d) { if (!d) return '-'; return new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function formatCurrency(n) { return '$' + Number(n || 0).toFixed(2); }
function badge(status) {
  var m = { pending: 'badge-warning', active: 'badge-success', in_progress: 'badge-info', completed: 'badge-success', cancelled: 'badge-danger', paid: 'badge-success', unpaid: 'badge-warning', refunded: 'badge-info', failed: 'badge-danger', open: 'badge-warning', resolved: 'badge-success', closed: 'badge-default', true: 'badge-success', false: 'badge-default', admin: 'badge-info', super_admin: 'badge-danger', user: 'badge-default' };
  return '<span class="badge ' + (m[status] || 'badge-default') + '">' + escapeHtml(status) + '</span>';
}

// ===== TOAST =====
function toast(msg, type) {
  var c = $('toast-container');
  var t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.innerHTML = msg;
  c.appendChild(t);
  setTimeout(function() { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function() { t.remove(); }, 300); }, 3000);
}

// ===== MODAL =====
function openModal(html) {
  $('modal-content').innerHTML = html;
  $('modal-overlay').classList.add('open');
}
function closeModal() { $('modal-overlay').classList.remove('open'); }
$('modal-overlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

// ===== NAVIGATION =====
qsa('.nav-item[data-section]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    qsa('.nav-item[data-section]').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    switchSection(btn.getAttribute('data-section'));
  });
});

function switchSection(name) {
  currentSection = name;
  qsa('.page-section').forEach(function(s) { s.classList.remove('active'); });
  var section = document.getElementById('section-' + name);
  if (!section) {
    if (typeof renderers[name] === 'function') renderers[name]();
    else renderDashboard();
  }
}

// ===== AUTH =====
$('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  var email = $('login-email').value;
  var password = $('login-password').value;
  var btn = $('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  $('login-error').classList.remove('show');
  try {
    var { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await initAdmin(data.user);
  } catch (err) {
    $('login-error').textContent = err.message || 'Invalid email or password';
    $('login-error').classList.add('show');
  }
  btn.disabled = false; btn.textContent = 'Sign In';
});

async function initAdmin(user) {
  var { data: profile } = await sb.from('users').select('*').eq('id', user.id).single();
  if (!profile || (profile.role !== 'admin' && profile.role !== 'super_admin')) {
    await sb.auth.signOut();
    $('login-error').textContent = 'Access denied. Admin privileges required.';
    $('login-error').classList.add('show');
    return;
  }
  currentUser = profile;
  $('login-view').classList.add('hidden');
  $('admin-view').classList.add('active');
  initRealtime();
  renderDashboard();
}

async function checkSession() {
  var { data: { session } } = await sb.auth.getSession();
  if (session) await initAdmin(session.user);
}
checkSession();

$('logout-btn').addEventListener('click', async function() {
  await sb.auth.signOut();
  currentUser = null;
  $('admin-view').classList.remove('active');
  $('login-view').classList.remove('hidden');
});

// ===== REALTIME =====
function initRealtime() {
  sb.channel('admin-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, function() { if (currentSection === 'dashboard') renderDashboard(); else if (currentSection === 'orders') renderOrders(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, function() { if (currentSection === 'users') renderUsers(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'payments' }, function() { if (currentSection === 'payments' || currentSection === 'dashboard') loadDashboardStats(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'coupons' }, function() { if (currentSection === 'coupons') renderCoupons(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'ai_models' }, function() { if (currentSection === 'ai-models') renderAIModels(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tools' }, function() { if (currentSection === 'tools') renderTools(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'user_projects' }, function() { if (currentSection === 'projects' || currentSection === 'users') { renderProjects(); } })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'active_sessions' }, function() { if (currentSection === 'sessions') renderSessions(); })
    .subscribe();
}

function filterTable(bodyId, query) {
  var rows = qsa('#' + bodyId + ' tr');
  var q = query.toLowerCase();
  rows.forEach(function(r) {
    r.style.display = (q === '' || r.textContent.toLowerCase().indexOf(q) !== -1) ? '' : 'none';
  });
}

// ===== RENDERERS =====
var renderers = {};

// ===== DASHBOARD =====
async function loadDashboardStats() {
  try {
    var now = new Date();
    var thirtyDaysAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000).toISOString();
    var [{ data: orders }, { data: users }, { data: payments }, { data: recentOrders }, { data: tickets }, { data: models }, { data: activeSessions }, { data: projects }, { data: coupons }] = await Promise.all([
      sb.from('orders').select('*'),
      sb.from('users').select('*'),
      sb.from('payments').select('*').gte('created_at', thirtyDaysAgo),
      sb.from('orders').select('*').order('created_at', { ascending: false }).limit(5),
      sb.from('support_tickets').select('*').eq('status', 'open'),
      sb.from('ai_models').select('*'),
      sb.from('active_sessions').select('*').eq('is_active', true),
      sb.from('user_projects').select('*').eq('status', 'active'),
      sb.from('coupons').select('*').eq('is_active', true)
    ]);
    ordersCache = orders || [];
    usersCache = users || [];
    var monthlyRevenue = (payments || []).filter(function(p) { return p.status === 'completed'; }).reduce(function(s, p) { return s + Number(p.amount || 0); }, 0);
    var pendingOrders = (orders || []).filter(function(o) { return o.status === 'pending'; }).length;
    var openTickets = (tickets || []).length;
    var totalUsers = (users || []).length;

function filterOrders() {
  var q = $('orders-search').value.toLowerCase();
  var s = $('orders-filter').value;
  var rows = qsa('#orders-body tr');
  rows.forEach(function(r) {
    if (!r.dataset) return;
    var match = true;
    if (s !== 'all' && r.getAttribute('data-status') !== s) match = false;
    if (q && r.textContent.toLowerCase().indexOf(q) === -1) match = false;
    r.style.display = match ? '' : 'none';
  });
}

async function loadOrders() {
  try {
    var { data: orders, error } = await sb.from('orders').select('*, users:user_id(email, full_name)').order('created_at', { ascending: false });
    if (error) throw error;
    ordersCache = orders || [];

    '<div class="form-group"><label>Category</label><select class="form-control" id="tool-cat"><option value="ai">AI</option><option value="design">Design</option><option value="engineering">Engineering</option><option value="export">Export</option><option value="monitoring">Monitoring</option><option value="automation">Automation</option><option value="other">Other</option></select></div></div>' +
    '<div class="form-group"><label>Description</label><textarea class="form-control" id="tool-desc" rows="2"></textarea></div>' +
    '<div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Add Tool</button></div></form>');
  $('tool-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    try {
      var { error } = await sb.from('tools').insert({
        name: $('tool-name').value, category: $('tool-cat').value,
        description: $('tool-desc').value, is_active: true
      });
      if (error) throw error;
      toast('Tool added', 'success');
      closeModal();
      renderTools();
    } catch(e) { toast('Error: ' + e.message, 'error'); }
  });
};

window.editTool = async function(id) {
  var { data: tool } = await sb.from('tools').select('*').eq('id', id).single();
  if (!tool) return;
  openModal('<button class="modal-close" onclick="closeModal()">&times;</button><h2>' + escapeHtml(tool.name) + '</h2>' +
    '<form id="tool-form"><div class="form-group"><label>Status</label><select class="form-control" id="tool-active"><option value="true"' + (tool.is_active ? ' selected' : '') + '>Active</option><option value="false"' + (!tool.is_active ? ' selected' : '') + '>Disabled</option></select></div>' +
    '<div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form>');
  $('tool-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    try {
      var { error } = await sb.from('tools').update({ is_active: $('tool-active').value === 'true' }).eq('id', id);
      if (error) throw error;
      toast('Tool updated', 'success');
      closeModal();
      renderTools();
    } catch(e) { toast('Error: ' + e.message, 'error'); }
  });
};

renderers.tools = renderTools;

// ===== PROJECTS =====
async function renderProjects() {
  var main = $('main-content');
  main.innerHTML = '<div class="page-header"><div><h1>User Projects</h1><div class="subtitle">All projects across the platform</div></div><div class="search-bar"><input type="text" id="projects-search" placeholder="Search projects..." oninput="filterTable(\'projects-body\', this.value)"><select id="projects-filter" class="form-control" style="width:auto;padding:10px 14px" onchange="renderProjects()"><option value="all">All</option><option value="active">Active</option><option value="paused">Paused</option><option value="completed">Completed</option><option value="archived">Archived</option></select></div></div>' +
    '<div class="card"><div class="table-wrap"><table><thead><tr><th>Project</th><th>User</th><th>Type</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody id="projects-body"><tr><td colspan="6"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div></td></tr></tbody></table></div></div>';
  try {
    var filter = $('projects-filter').value;
    var q = sb.from('user_projects').select('*, users:user_id(email, full_name)').order('created_at', { ascending: false });
    if (filter !== 'all') q = q.eq('status', filter);
    var { data: projects, error } = await q;
    if (error) throw error;
    var tbody = $('projects-body');
    if (!projects || projects.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-folder"></i><p>No projects</p></div></td></tr>';
    } else {
      tbody.innerHTML = projects.map(function(p) {
        var name = p.users ? (p.users.full_name || p.users.email) : 'Unknown';
        return '<tr><td><strong>' + escapeHtml(p.name) + '</strong></td><td>' + escapeHtml(name) + '</td><td><span class="badge badge-info">' + escapeHtml(p.type) + '</span></td><td>' + badge(p.status) + '</td><td>' + formatDate(p.created_at) + '</td><td><button class="btn btn-ghost btn-sm" onclick="editProject(\'' + p.id + '\')"><i class="fas fa-edit"></i></button></td></tr>';
      }).join('');
    }
  } catch(e) { console.error('Projects load error:', e); }
}

window.editProject = async function(id) {
  var { data: project } = await sb.from('user_projects').select('*').eq('id', id).single();
  if (!project) return;
  openModal('<button class="modal-close" onclick="closeModal()">&times;</button><h2>Edit Project</h2>' +
    '<form id="project-form"><div class="form-group"><label>Status</label><select class="form-control" id="project-status"><option value="active"' + (project.status === 'active' ? ' selected' : '') + '>Active</option><option value="paused"' + (project.status === 'paused' ? ' selected' : '') + '>Paused</option><option value="completed"' + (project.status === 'completed' ? ' selected' : '') + '>Completed</option><option value="archived"' + (project.status === 'archived' ? ' selected' : '') + '>Archived</option></select></div>' +
    '<div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Update</button></div></form>');
  $('project-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    try {
      var { error } = await sb.from('user_projects').update({ status: $('project-status').value }).eq('id', id);
      if (error) throw error;
      toast('Project updated', 'success');
      closeModal();
      renderProjects();
    } catch(e) { toast('Error: ' + e.message, 'error'); }
  });
};

renderers.projects = renderProjects;

// ===== LIVE SESSIONS =====
async function renderSessions() {
  var main = $('main-content');
  main.innerHTML = '<div class="page-header"><div><h1>Live Sessions</h1><div class="subtitle">Real-time active user sessions</div></div></div>' +
    '<div class="stats-grid" id="session-stats"></div>' +
    '<div class="card"><div class="card-header"><div class="card-title">Active Sessions</div></div><div class="table-wrap"><table><thead><tr><th>User</th><th>Device</th><th>IP</th><th>Location</th><th>Last Activity</th><th></th></tr></thead><tbody id="sessions-body"><tr><td colspan="6"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div></td></tr></tbody></table></div></div>';
  try {
    var { data: sessions, error } = await sb.from('active_sessions').select('*, users:user_id(email, full_name)').order('last_activity_at', { ascending: false }).limit(100);
    if (error) throw error;
    var activeSessions = (sessions || []).filter(function(s) { return s.is_active; });
    $('session-stats').innerHTML =
      '<div class="stat-card"><div class="icon" style="background:rgba(16,185,129,0.12);color:var(--success)"><i class="fas fa-signal"></i></div><div class="value">' + activeSessions.length + '</div><div class="label">Active Now</div></div>' +
      '<div class="stat-card"><div class="icon" style="background:rgba(99,102,241,0.12);color:var(--accent)"><i class="fas fa-clock"></i></div><div class="value">' + (sessions ? sessions.length : 0) + '</div><div class="label">Total Today</div></div>' +
      '<div class="stat-card"><div class="icon" style="background:rgba(245,158,11,0.12);color:var(--warning)"><i class="fas fa-user"></i></div><div class="value">' + new Set((sessions || []).map(function(s) { return s.user_id; })).size + '</div><div class="label">Unique Users</div></div>';
    var tbody = $('sessions-body');
    if (!sessions || sessions.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-signal"></i><p>No sessions recorded</p></div></td></tr>';
    } else {
      tbody.innerHTML = sessions.map(function(s) {
        var name = s.users ? (s.users.full_name || s.users.email) : 'Unknown';
        return '<tr><td>' + escapeHtml(name) + '</td><td>' + escapeHtml(s.device || s.user_agent || '-') + '</td><td><code style="font-size:11px;color:var(--text2)">' + escapeHtml(s.ip_address || '-') + '</code></td><td>' + escapeHtml(s.location || '-') + '</td><td>' + (s.is_active ? '<span style="color:var(--success)">●</span> ' : '') + formatDateTime(s.last_activity_at) + '</td><td><button class="btn btn-ghost btn-sm" onclick="terminateSession(\'' + s.id + '\')" style="color:var(--danger)"><i class="fas fa-times"></i></button></td></tr>';
      }).join('');
    }
  } catch(e) { console.error('Sessions load error:', e); }
}

window.terminateSession = async function(id) {
  if (!confirm('Terminate this session?')) return;
  try {
    var { error } = await sb.from('active_sessions').update({ is_active: false }).eq('id', id);
    if (error) throw error;
    toast('Session terminated', 'success');
    renderSessions();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
};

renderers.sessions = renderSessions;

// ===== ROUTE: Re-render on section switch =====
var originalSwitch = switchSection;
switchSection = function(name) {
  originalSwitch(name);
  if (typeof renderers[name] === 'function') renderers[name]();
};
</script>
</body>
</html>
