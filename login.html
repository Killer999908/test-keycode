<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - KEYCODE Studio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --black: #000000;
      --void: #030305;
      --obsidian: #0a0a0f;
      --graphite: #12121a;
      --slate: #1a1a24;
      --primary: #6366f1;
      --primary-glow: #818cf8;
      --primary-deep: #4f46e5;
      --secondary: #ec4899;
      --accent: #22d3ee;
      --success: #10b981;
      --white: #ffffff;
      --ivory: #f8fafc;
      --pearl: #e2e8f0;
      --silver: #e5e7eb;
      --ash: #d1d5db;
      --gradient-1: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      --font-display: 'Syne', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: var(--void);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #video-bg-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      overflow: hidden;
      background: linear-gradient(135deg, #0a0a15 0%, #1a1a40 50%, #0f0f2e 100%);
    }
    #video-bg {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      min-width: 100%; min-height: 100%;
      object-fit: cover;
      opacity: 0.3;
    }
    #video-cover {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(3, 3, 5, 0.85);
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      background: rgba(17, 17, 23, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 0 80px rgba(99, 102, 241, 0.15);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-text {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 800;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: var(--ash);
      font-size: 14px;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--pearl);
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ash);
      font-size: 16px;
    }
    input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(26, 26, 36, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
      color: var(--white);
      font-family: var(--font-body);
      font-size: 15px;
      transition: all 0.3s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
    }
    input::placeholder { color: var(--ash); }
    .checkbox-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .remember-me input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: var(--primary);
    }
    .remember-me span {
      font-size: 14px;
      color: var(--ash);
    }
    .forgot-link {
      font-size: 14px;
      color: var(--primary);
      text-decoration: none;
      transition: color 0.3s;
    }
    .forgot-link:hover { color: var(--primary-glow); }
    .captcha-wrapper {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
    }
    .btn-login {
      width: 100%;
      padding: 16px;
      background: var(--gradient-1);
      border: none;
      border-radius: 12px;
      color: white;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4);
    }
    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--ash);
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }
    .divider span { padding: 0 16px; }
    .social-login {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .btn-social {
      flex: 1;
      padding: 14px;
      background: rgba(26, 26, 36, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-social:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary);
    }
    .register-link {
      text-align: center;
      font-size: 14px;
      color: var(--ash);
    }
    .register-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .register-link a:hover { color: var(--primary-glow); }
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #ef4444;
      font-size: 14px;
      display: none;
    }
    .error-message.show { display: block; }
    .loading { position: relative; }
    .loading::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      top: 50%; left: 50%;
      margin: -10px 0 0 -10px;
      border: 2px solid transparent;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="video-bg-container">
    <video id="video-bg" autoplay loop playsinline muted preload="auto">
      <source src="./video-bg-new.mp4" type="video/mp4">
    </video>
    <div id="video-cover"></div>
  </div>

  <div class="login-container animate-pop">
    <div class="logo">
      <span class="logo-text">KEYCODE</span>
    </div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to access your dashboard</p>

    <div class="error-message" id="errorMessage"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Enter your password" required>
          <span onclick="togglePassword()" style="cursor:pointer;padding:0 12px;color:var(--ash);font-size:14px" id="passwordToggle"><i class="fas fa-eye"></i></span>
        </div>
      </div>

      <div class="checkbox-group">
        <label class="remember-me">
          <input type="checkbox" id="remember">
          <span>Remember me</span>
        </label>
        <a href="reset-password.html" class="forgot-link">Forgot password?</a>
      </div>

      <div class="captcha-wrapper" id="turnstileWrapper">
        <div id="turnstile-container"></div>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">Sign In</button>
    </form>

    <div class="divider"><span>Or continue with</span></div>
    <div class="social-login">
      <a href="/api/auth/google" class="btn-social" title="Sign in with Google">
        <i class="fab fa-google"></i>
      </a>
      <a href="/api/auth/github" class="btn-social" title="Sign in with GitHub">
        <i class="fab fa-github"></i>
      </a>
      <a href="/api/auth/discord" class="btn-social" title="Sign in with Discord">
        <i class="fab fa-discord"></i>
      </a>
    </div>

    <div class="register-link">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
      <div class="register-link" style="margin-top:8px;">
        <a href="otp-login.html"><i class="fas fa-mobile-alt"></i> Sign in with OTP</a>
      </div>
  </div>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    let turnstileToken = '';
    
    // Initialize Turnstile when script loads
    function initTurnstile() {
      if (typeof turnstile !== 'undefined') {
        turnstile.render('#turnstile-container', {
          sitekey: '0x4AAAAAABxxxxxxxxxxxxxxxx', // Replace with your site key
          theme: 'dark',
          callback: function(token) {
            turnstileToken = token;
          },
          'error-callback': function() {
            console.log('Turnstile error');
          }
        });
      }
    }
    
    const video = document.getElementById('video-bg');
    video?.play()?.catch(() => {});

    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');

    // Password visibility toggle
    window.togglePassword = function() {
      var p = document.getElementById('password');
      var t = document.getElementById('passwordToggle');
      if (p.type === 'password') { p.type = 'text'; t.innerHTML = '<i class="fas fa-eye-slash"></i>'; }
      else { p.type = 'password'; t.innerHTML = '<i class="fas fa-eye"></i>'; }
    };

    // Remember me: load saved email
    try {
      var saved = localStorage.getItem('remembered_email');
      if (saved) { document.getElementById('email').value = saved; document.getElementById('remember').checked = true; }
    } catch(e) {}

    // Handle OAuth callback: parse token from URL
    (function() {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');
      if (token) {
        var name = params.get('name') || 'User';
        var email = params.get('email') || '';
        var avatar = params.get('avatar') || '';
        localStorage.setItem('token', token);
        localStorage.setItem('keycode_token', token);
        localStorage.setItem('user', JSON.stringify({ name: decodeURIComponent(name), email: decodeURIComponent(email), avatar: decodeURIComponent(avatar) }));
        localStorage.setItem('keycode_user', JSON.stringify({ name: decodeURIComponent(name), email: decodeURIComponent(email), avatar: decodeURIComponent(avatar) }));
        window.location.href = 'control-panel.html';
      }
    })();

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessage.classList.remove('show');
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, turnstileToken })
        });

        const data = await response.json();

        if (!response.ok) {
          if (data.error && data.lockUntil) {
            throw new Error(data.error);
          }
          throw new Error(data.error || 'Login failed');
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('keycode_token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.setItem('keycode_user', JSON.stringify(data.user));

        // Remember me
        if (document.getElementById('remember').checked) {
          localStorage.setItem('remembered_email', document.getElementById('email').value);
        } else {
          localStorage.removeItem('remembered_email');
        }

        var redirect = new URLSearchParams(window.location.search).get('redirect');
        window.location.href = redirect === 'ai-builder' ? 'ai-builder.html' : 'control-panel.html';
      } catch (err) {
        errorMessage.textContent = err.message;
        errorMessage.classList.add('show');
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
      }
    });
  </script>
  <script>
  // ===== TOAST SYSTEM =====
  (function(){
    var c = document.createElement('div');
    c.style.cssText = 'position:fixed;top:16px;right:16px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:380px';
    document.body.appendChild(c);
    var s = document.createElement('style');
    s.textContent = '@keyframes tIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}@keyframes tOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}';
    document.head.appendChild(s);
    window.showToast = function(m,type) {
      type=type||'info'; var cl={info:'#6366f1',success:'#10b981',error:'#ef4444',warning:'#f59e0b'},ic={info:'fa-info-circle',success:'fa-check-circle',error:'fa-exclamation-circle',warning:'fa-exclamation-triangle'};
      var t=document.createElement('div'); t.style.cssText='padding:12px 16px;border-radius:10px;background:'+(cl[type]||'#6366f1')+';color:#fff;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 8px 32px rgba(0,0,0,0.4);animation:tIn .3s ease;cursor:pointer';
      t.innerHTML='<i class="fas '+(ic[type]||'fa-info-circle')+'"></i> '+m;
      t.onclick=function(){t.style.animation='tOut .2s ease';setTimeout(function(){t.remove()},200)};
      c.appendChild(t); setTimeout(function(){if(t.parentNode){t.style.animation='tOut .2s ease';setTimeout(function(){t.remove()},200)}},4000);
    };
    window.alert = function(m) { showToast(m, 'warning'); };
  })();
  </script>
</body>
</html>
