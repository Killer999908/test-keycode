<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - KEYCODE Studio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --void: #030305;
      --obsidian: #0a0a0f;
      --slate: #1a1a24;
      --primary: #6366f1;
      --primary-glow: #818cf8;
      --secondary: #ec4899;
      --accent: #22d3ee;
      --success: #10b981;
      --white: #ffffff;
      --pearl: #e2e8f0;
      --ash: #d1d5db;
      --gradient-1: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      --font-display: 'Syne', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: var(--void);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #video-bg-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      background: linear-gradient(135deg, #0a0a15 0%, #1a1a40 50%, #0f0f2e 100%);
    }
    #video-bg {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      min-width: 100%; min-height: 100%;
      object-fit: cover;
      opacity: 0.3;
    }
    #video-cover {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(3, 3, 5, 0.85);
    }
    .register-container {
      width: 100%;
      max-width: 420px;
      background: rgba(17, 17, 23, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 0 80px rgba(99, 102, 241, 0.15);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-text {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 800;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: var(--ash);
      font-size: 14px;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--pearl);
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ash);
      font-size: 16px;
    }
    input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(26, 26, 36, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
      color: var(--white);
      font-family: var(--font-body);
      font-size: 15px;
      transition: all 0.3s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
    }
    input::placeholder { color: var(--ash); }
    .password-requirements {
      font-size: 12px;
      color: var(--ash);
      margin-top: 8px;
    }
    .password-strength {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .strength-bar {
      height: 4px;
      flex: 1;
      background: var(--slate);
      border-radius: 2px;
      transition: all 0.3s;
    }
    .strength-bar.weak { background: #ef4444; }
    .strength-bar.medium { background: #f59e0b; }
    .strength-bar.strong { background: #22c55e; }
    .strength-text {
      font-size: 12px;
      margin-top: 4px;
    }
    .strength-text.weak { color: #ef4444; }
    .strength-text.medium { color: #f59e0b; }
    .strength-text.strong { color: #22c55e; }
    .btn-register {
      width: 100%;
      padding: 16px;
      background: var(--gradient-1);
      border: none;
      border-radius: 12px;
      color: white;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      margin-top: 8px;
    }
    .btn-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4);
    }
    .btn-register:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--ash);
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }
    .divider span { padding: 0 16px; }
    .social-login {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .btn-social {
      flex: 1;
      padding: 14px;
      background: rgba(26, 26, 36, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: all 0.3s;
    }
    .btn-social:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary);
    }
    .terms-text {
      text-align: center;
      font-size: 13px;
      color: var(--ash);
      margin: 20px 0;
    }
    .terms-text a {
      color: var(--primary);
      text-decoration: none;
    }
    .terms-text a:hover { color: var(--primary-glow); }
    .login-link {
      text-align: center;
      font-size: 14px;
      color: var(--ash);
    }
    .login-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .login-link a:hover { color: var(--primary-glow); }
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #ef4444;
      font-size: 14px;
      display: none;
    }
    .error-message.show { display: block; }
    .success-message {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      color: var(--success);
      font-size: 14px;
      display: none;
    }
    .success-message.show { display: block; }
    .loading { position: relative; }
    .loading::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      top: 50%; left: 50%;
      margin: -10px 0 0 -10px;
      border: 2px solid transparent;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="video-bg-container">
    <video id="video-bg" autoplay loop playsinline muted preload="auto">
      <source src="./video-bg-new.mp4" type="video/mp4">
    </video>
    <div id="video-cover"></div>
  </div>

  <div class="register-container animate-pop">
    <div class="logo">
      <span class="logo-text">KEYCODE</span>
    </div>
    <h1>Create Account</h1>
    <p class="subtitle">Start your journey with KEYCODE</p>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input type="text" id="name" placeholder="Enter your name" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Create a password" required minlength="6">
        </div>
        <p class="password-requirements">Must be at least 8 characters</p>
        <div class="password-strength" id="strengthMeter">
          <div class="strength-bar"></div>
          <div class="strength-bar"></div>
          <div class="strength-bar"></div>
        </div>
        <p class="strength-text" id="strengthText"></p>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <i class="fas fa-shield-halved"></i>
          <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
        </div>
      </div>

      <button type="submit" class="btn-register" id="submitBtn">Create Account</button>
    </form>

    <div class="divider"><span>Or sign up with</span></div>
    <div class="social-login">
      <a href="/api/auth/google" class="btn-social" title="Sign up with Google">
        <i class="fab fa-google"></i>
      </a>
      <a href="/api/auth/github" class="btn-social" title="Sign up with GitHub">
        <i class="fab fa-github"></i>
      </a>
      <a href="/api/auth/discord" class="btn-social" title="Sign up with Discord">
        <i class="fab fa-discord"></i>
      </a>
    </div>

    <p class="terms-text">
      By registering, you agree to our <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>
    </p>

    <p class="login-link">
      Already have an account? <a href="login.html">Sign in</a>
    </p>
  </div>

  <script>
    const video = document.getElementById('video-bg');
    video?.play()?.catch(() => {});

    const registerForm = document.getElementById('registerForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');
    const passwordInput = document.getElementById('password');
    const strengthBars = document.querySelectorAll('.strength-bar');
    const strengthText = document.getElementById('strengthText');

    // Password Strength Meter
    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      let strength = 0;
      if (val.length >= 8) strength++;
      if (val.match(/[a-z]/) && val.match(/[A-Z]/)) strength++;
      if (val.match(/\d/) && val.match(/[^a-zA-Z0-9]/)) strength++;
      
      const labels = ['weak', 'medium', 'strong'];
      const colors = ['#ef4444', '#f59e0b', '#22c55e'];
      const texts = ['Weak', 'Medium', 'Strong'];
      
      strengthBars.forEach((bar, i) => {
        bar.className = 'strength-bar';
        if (i < strength) bar.classList.add(labels[Math.min(i, 2)]);
      });
      
      strengthText.textContent = strength > 0 ? texts[Math.min(strength - 1, 2)] + ' password' : '';
      strengthText.className = 'strength-text' + (strength > 0 ? ' ' + labels[Math.min(strength - 1, 2)] : '');
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        errorMessage.textContent = 'Passwords do not match';
        errorMessage.classList.add('show');
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
        return;
      }

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Registration failed');
        }

        successMessage.textContent = 'Account created! Redirecting to login...';
        successMessage.classList.add('show');
        
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } catch (err) {
        errorMessage.textContent = err.message;
        errorMessage.classList.add('show');
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
