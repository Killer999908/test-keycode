  <!-- Boot watchdog: the homepage can never be silently empty.
       If the app fails to mount (stale SW cache, blocked module, network flap),
       this retries with cache-bypass, then shows a graceful fallback with
       real links instead of a blank screen. -->
  <script>
  (function () {
    var tries = 0;
    function appBooted() {
      return !!document.querySelector('#ui') && document.body.classList.contains('ready');
    }
    function escape() {
      if (document.getElementById('kc-boot-fail')) return;
      var f = document.createElement('div');
      f.id = 'kc-boot-fail';
      f.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#08080a;display:grid;place-items:center;padding:24px;text-align:center;font-family:Inter,system-ui,sans-serif;color:#fafafa';
      f.innerHTML = '<div style="max-width:440px">' +
        '<div style="font-weight:800;letter-spacing:.2em;font-size:13px;margin-bottom:14px;color:#a1a1aa">KEYCODE</div>' +
        '<h1 style="font-size:22px;font-weight:600;margin:0 0 10px">One moment — the stage is re-decorating.</h1>' +
        '<p style="color:#a1a1aa;font-size:14px;line-height:1.6;margin:0 0 22px">The immersive version hit a snag (usually a stale offline cache). The essentials are one click away:</p>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">' +
        '<a href="/ai-builder.html" style="padding:11px 20px;border-radius:999px;background:#fff;color:#0a0a0b;text-decoration:none;font-weight:600;font-size:13px">Open AI Builder</a>' +
        '<a href="/dashboard.html" style="padding:11px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:#fafafa;text-decoration:none;font-size:13px">Dashboard</a>' +
        '<a href="/gallery.html" style="padding:11px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:#fafafa;text-decoration:none;font-size:13px">Works</a>' +
        '</div></div>';
      document.body.appendChild(f);
    }
    setTimeout(function loop() {
      if (appBooted()) return;
      tries++;
      if (tries === 2) {
        // Reload once, bypassing every cache (also re-registers a fresh SW)
        if (!sessionStorage.getItem('kc-boot-retry')) {
          sessionStorage.setItem('kc-boot-retry', '1');
          location.reload();
          return;
        }
      }
      if (tries >= 4) { escape(); return; }
      setTimeout(loop, 1600);
    }, 1600);
  })();
  </script>
