<!DOCTYPE html>
<html lang="en" data-kc-theme data-kc-error>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — KEYCODE</title>
  <meta name="description" content="You are offline">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a; color: #fff;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 20px 40px;
    }
    .kc-offline { text-align: center; max-width: 400px; }
    .kc-offline-icon {
      width: 48px; height: 48px; margin: 0 auto 24px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .kc-offline-icon svg { width: 24px; height: 24px; stroke: rgba(255,255,255,0.4); fill: none; }
    .kc-offline h1 {
      font-family: 'Syne', sans-serif;
      font-size: 18px; font-weight: 700; margin-bottom: 12px;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .kc-offline p {
      color: rgba(255,255,255,0.4);
      margin-bottom: 40px; font-size: 14px; line-height: 1.6;
    }
    .kc-offline a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 32px;
      background: #fff; color: #000;
      border: 1px solid #fff;
      font-family: 'Syne', sans-serif;
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s;
      border-radius: 999px;
    }
    .kc-offline a:hover { background: transparent; color: #fff; }
  </style>
  <link rel="stylesheet" href="/theme.css">
  <script defer src="/theme.js"></script>
</head>
<body>
  <div class="kc-offline">
    <div class="kc-offline-icon">
      <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path d="M18.36 6.64a9 9 0 11-12.73 12.73M5.64 17.36A9 9 0 1118.36 6.64"/>
        <line x1="12" y1="2" x2="12" y2="9"/>
        <line x1="12" y1="15" x2="12" y2="22"/>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>Please check your internet connection and try again.</p>
    <a href="/">Retry →</a>
  </div>
</body>
</html>
