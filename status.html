<style>
:root {
  --bg: #0a0a1a;
  --card: #12122a;
  --primary: #ffffff;
  --accent: #22d3ee;
  --text: #e2e8f0;
  --ash: #94a3b8;
  --success: #10b981;
  --warning: #f59e0b;
  --error: #ef4444;
  --border: rgba(255,255,255,0.06);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --radius: 12px;
  --radius-lg: 16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  line-height:1.6;
  overflow-x:hidden;
}

a{color:var(--primary);text-decoration:none}
a:hover{color:var(--accent)}
img{max-width:100%;height:auto;display:block}

.container{max-width:1100px;margin:0 auto;padding:0 24px}

/* Navbar */
.navbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;max-width:1148px;margin:0 auto;
  border-bottom:1px solid var(--border);
}
.nav-logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;color:var(--text);letter-spacing:-0.5px}
.nav-logo img{height:32px;width:auto}
.nav-links{display:flex;align-items:center;gap:4px;list-style:none}
.nav-links a{
  padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;
  color:var(--ash);transition:all .2s;
}
.nav-links a:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.nav-links a.active{color:var(--primary);background:rgba(99,102,241,0.1)}
.nav-actions{display:flex;align-items:center;gap:12px}

/* Status Badge Header */
.status-badge-header{
  display:none;align-items:center;gap:8px;
  padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;
}
.status-badge-header.visible{display:flex}

/* Summary Banner */
.summary-banner{
  margin:32px auto;padding:32px 40px;border-radius:var(--radius-lg);
  text-align:center;position:relative;overflow:hidden;
  border:1px solid var(--border);
}
.summary-banner .icon{font-size:40px;margin-bottom:12px;display:block}
.summary-banner h1{font-size:28px;font-weight:700;margin-bottom:6px;letter-spacing:-0.3px}
.summary-banner p{font-size:15px;opacity:.8;margin-bottom:4px}
.summary-banner .timestamp{font-size:13px;opacity:.5;margin-top:8px}
.summary-banner.success{background:linear-gradient(135deg,rgba(16,185,129,0.08),rgba(16,185,129,0.02))}
.summary-banner.success h1{color:var(--success)}
.summary-banner.warning{background:linear-gradient(135deg,rgba(245,158,11,0.08),rgba(245,158,11,0.02))}
.summary-banner.warning h1{color:var(--warning)}
.summary-banner.error{background:linear-gradient(135deg,rgba(239,68,68,0.1),rgba(239,68,68,0.02))}
.summary-banner.error h1{color:var(--error)}

/* Controls */
.status-controls{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;flex-wrap:wrap;gap:12px;
}
.status-controls .info{font-size:14px;color:var(--ash)}
.status-controls .info strong{color:var(--text)}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 20px;border:none;border-radius:8px;
  font-family:var(--font);font-size:14px;font-weight:600;
  cursor:pointer;transition:all .2s;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#5558e6;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{background:rgba(255,255,255,0.04);color:var(--ash);border:1px solid var(--border)}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text)}

@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
.spinner-sm{width:14px;height:14px;border-width:2px}

/* Section Headers */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;margin-top:40px;
}
.section-header h2{font-size:20px;font-weight:700;letter-spacing:-0.2px}
.section-header .count{font-size:13px;color:var(--ash);background:rgba(255,255,255,0.04);padding:4px 12px;border-radius:20px}

/* Components Grid */
.components-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.component-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;transition:all .2s;position:relative;
}
.component-card:hover{border-color:rgba(255,255,255,0.1);transform:translateY(-2px)}
.component-card .top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.component-card .icon-wrap{
  width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:rgba(99,102,241,0.1);color:var(--primary);font-size:18px;
}
.component-card .name{font-size:15px;font-weight:600;margin-bottom:2px}
.component-card .status-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.success{background:var(--success);box-shadow:0 0 6px rgba(16,185,129,0.4)}
.dot.warning{background:var(--warning);box-shadow:0 0 6px rgba(245,158,11,0.4)}
.dot.error{background:var(--error);box-shadow:0 0 6px rgba(239,68,68,0.4)}
.dot.neutral{background:var(--ash)}
.status-label{font-size:14px;font-weight:500}
.status-label.success{color:var(--success)}
.status-label.warning{color:var(--warning)}
.status-label.error{color:var(--error)}
.component-card .meta{font-size:13px;color:var(--ash);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.component-card .meta span{display:flex;align-items:center;gap:4px}
.uptime-bar{
  margin-top:12px;height:4px;border-radius:4px;background:rgba(255,255,255,0.06);overflow:hidden;
}
.uptime-bar .fill{height:100%;border-radius:4px;transition:width .6s}
.uptime-bar .fill.success{background:var(--success)}
.uptime-bar .fill.warning{background:var(--warning)}
.uptime-bar .fill.error{background:var(--error)}

/* Skeleton loading */
.skeleton{
  background:linear-gradient(90deg,var(--card) 25%,rgba(255,255,255,0.04) 50%,var(--card) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.skel-icon{width:40px;height:40px;border-radius:10px;margin-bottom:12px}
.skel-line{height:14px;margin-bottom:8px;width:60%}
.skel-line.w60{width:60%}
.skel-line.w40{width:40%}
.skel-line.w80{width:80%}
.skel-line.w30{width:30%}

/* Incident Timeline */
.timeline{position:relative;padding-left:28px}
.timeline::before{
  content:'';position:absolute;left:10px;top:8px;bottom:8px;
  width:1px;background:var(--border);
}
.timeline-item{
  position:relative;padding:16px 20px;margin-bottom:8px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
}
.timeline-item::before{
  content:'';position:absolute;left:-20px;top:22px;
  width:12px;height:12px;border-radius:50%;background:var(--primary);
  border:2px solid var(--bg);
}
.timeline-item.resolved::before{background:var(--success)}
.timeline-item.investigating::before{background:var(--warning)}
.timeline-item .time{font-size:12px;color:var(--ash);margin-bottom:4px}
.timeline-item h4{font-size:15px;font-weight:600;margin-bottom:4px}
.timeline-item p{font-size:14px;color:var(--ash);line-height:1.5}
.timeline-item .badge{
  display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;
  margin-top:8px;
}
.badge.resolved{background:rgba(16,185,129,0.12);color:var(--success)}
.badge.investigating{background:rgba(245,158,11,0.12);color:var(--warning)}
.badge.identified{background:rgba(99,102,241,0.12);color:var(--primary)}

/* Uptime Widget */
.uptime-widget{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:28px;margin-top:40px;
}
.uptime-widget .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.uptime-widget h3{font-size:18px;font-weight:700}
.uptime-widget .pct{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--success),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.dots-grid{display:flex;gap:3px;flex-wrap:wrap}
.dots-grid .day-dot{width:10px;height:10px;border-radius:3px;transition:transform .15s}
.dots-grid .day-dot:hover{transform:scale(1.5)}
.dots-grid .day-dot.up{background:var(--success)}
.dots-grid .day-dot.down{background:var(--error)}
.dots-grid .day-dot.degraded{background:var(--warning)}
.uptime-legend{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--ash)}
.uptime-legend span{display:flex;align-items:center;gap:6px}
.uptime-legend .swatch{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Subscribe */
.subscribe-section{
  margin-top:40px;padding:32px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius-lg);text-align:center;
}
.subscribe-section h3{font-size:20px;font-weight:700;margin-bottom:6px}
.subscribe-section p{font-size:14px;color:var(--ash);margin-bottom:20px}
.subscribe-form{display:flex;gap:12px;max-width:460px;margin:0 auto;flex-wrap:wrap;justify-content:center}
.subscribe-form input{
  flex:1;min-width:220px;padding:12px 16px;border-radius:8px;border:1px solid var(--border);
  background:rgba(255,255,255,0.04);color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border .2s;
}
.subscribe-form input:focus{border-color:var(--primary)}
.subscribe-form input::placeholder{color:var(--ash)}
.subscribe-form .btn{padding:12px 24px}
.subscribe-msg{font-size:13px;margin-top:10px;min-height:20px}
.subscribe-msg.success{color:var(--success)}
.subscribe-msg.error{color:var(--error)}

/* Footer */
.footer{
  margin-top:60px;padding:32px 0;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
}
.footer-links{display:flex;gap:20px;flex-wrap:wrap}
.footer-links a{font-size:13px;color:var(--ash)}
.footer-links a:hover{color:var(--text)}
.footer-copy{font-size:13px;color:var(--ash)}

/* Mobile */
@media(max-width:768px){
  .nav-links{display:none}
  .summary-banner{padding:24px 20px}
  .summary-banner h1{font-size:22px}
  .components-grid{grid-template-columns:1fr}
  .timeline{padding-left:20px}
  .subscribe-form input{min-width:100%}
  .footer{flex-direction:column;text-align:center}
  .status-controls{flex-direction:column;align-items:flex-start}
}

/* Error state */
.error-state{text-align:center;padding:60px 20px;color:var(--ash)}
.error-state .icon{font-size:48px;color:var(--error);margin-bottom:16px;display:block}
.error-state h3{color:var(--text);margin-bottom:8px}
.error-state p{font-size:14px;margin-bottom:16px}

/* Status dot pulse animation for operational */
.dot.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
</style>
