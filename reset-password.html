<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your KEYCODE Studio account password.">
  <title>Reset Password - KEYCODE Studio</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon-dRp91c1F.svg">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous">
  <style>
    :root {
      --void: #030305;
      --graphite: #12121a;
      --slate: #1a1a24;
      --primary: #ffffff;
      --white: #ffffff;
      --ash: #d1d5db;
      --success: #10b981;
      --danger: #ef4444;
      --gradient-1: linear-gradient(135deg, #ffffff 0%, #a3a3a3 50%, #ec4899 100%);
      --font-display: 'Syne', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: var(--void);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(17, 17, 23, 0.95);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 0 80px rgba(99, 102, 241, 0.15);
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo-text {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 800;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 { font-family: var(--font-display); font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    p { text-align: center; color: var(--ash); font-size: 14px; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: var(--ash); margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 14px 16px;
      background: var(--slate);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
      color: var(--white);
      font-size: 15px;
      transition: all 0.3s;
    }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
    .btn {
      width: 100%;
      padding: 16px;
      background: var(--gradient-1);
      border: none;
      border-radius: 12px;
      color: white;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4); }
    .back-link { display: block; text-align: center; margin-top: 24px; color: var(--primary); text-decoration: none; font-size: 14px; }
    .back-link:hover { color: var(--ash); }
    .message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .message.success { display: block; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: var(--success); }
    .message.error { display: block; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); }
  </style>
  </head>
<body>
  <div id="kc-loader">
    <div id="kc-loader-scene"></div>
      <div id="kc-bg-text" aria-hidden="true">KEYCODE</div>
<div class="kc-loader-info" style="position:absolute;bottom:48px;left:50%;transform:translateX(-50%);">
      <div id="kc-loader-bar-track"><div id="kc-loader-bar"></div></div>
      <div id="kc-loader-pct" style="font-family:'Inter',sans-serif;font-size:11px;color:#555;letter-spacing:.12em;text-align:center;">0%</div>
    </div>
  </div>

  <div class="container">
    <div class="logo"><span class="logo-text">KEYCODE</span></div>
    <h1>Reset Password</h1>
    <p id="subtitle">Enter your new password</p>

    <div id="message" class="message"></div>

    <form id="resetForm">
      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" placeholder="Min. 8 characters" required minlength="8">
      </div>
      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" placeholder="Confirm new password" required>
      </div>
      <button type="submit" class="btn">Reset Password</button>
    </form>

    <form id="emailForm" style="display:none;">
      <p>Enter your email to receive a reset link:</p>
      <div class="form-group" style="margin-top:20px;">
        <input type="email" id="email" placeholder="Your email address" required>
      </div>
      <button type="submit" class="btn">Send Reset Link</button>
    </form>

    <a href="login.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Login</a>
  </div>

  <script src="/js/scroll-3d-animations.js"></script>  <script src="/js/k-scroll.js" defer></script>

  <script>
  (function () {
    var qs = new URLSearchParams(location.search);
    var token = qs.get('token') || '';
    var msgEl = document.getElementById('message');
    function show(text, isErr) {
      msgEl.textContent = text;
      msgEl.style.display = 'block';
      msgEl.style.color = isErr ? '#f87171' : '#34d399';
    }

    if (!token) {
      // No token in URL → request-mode: show the email form.
      document.getElementById('subtitle').textContent = 'Enter your email to receive a reset link:';
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('emailForm').style.display = 'block';
    } else {
      // Token present → set-new-password mode.
      document.getElementById('subtitle').textContent = 'Choose a new password';
    }

    var emailForm = document.getElementById('emailForm');
    if (emailForm) {
      emailForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('email').value.trim();
        var btn = emailForm.querySelector('button');
        btn.disabled = true; btn.textContent = 'Sending…';
        fetch('/api/auth/forgot-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email }),
        }).then(function (r) { return r.json(); }).then(function (j) {
          if (j._dev_link) show('Dev mode: use this link → ' + j._dev_link, false);
          else show(j.message || 'Check your inbox for the reset link.', false);
          btn.textContent = 'Sent ✓';
        }).catch(function () {
          show('Could not send the request. Try again.', true);
          btn.disabled = false; btn.textContent = 'Send Reset Link';
        });
      });
    }

    var resetForm = document.getElementById('resetForm');
    if (resetForm) {
      resetForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var pw = document.getElementById('password').value;
        var cf = document.getElementById('confirm').value;
        if (pw !== cf) return show('Passwords do not match.', true);
        var btn = resetForm.querySelector('button');
        btn.disabled = true; btn.textContent = 'Resetting…';
        fetch('/api/auth/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, password: pw }),
        }).then(function (r) { return r.json(); }).then(function (j) {
          if (j.success) {
            show('Password updated! Redirecting to login…', false);
            setTimeout(function () { location.href = 'login.html?reset=ok'; }, 1500);
          } else {
            show(j.error || 'Reset failed.', true);
            btn.disabled = false; btn.textContent = 'Reset Password';
          }
        }).catch(function () {
          show('Network error — try again.', true);
          btn.disabled = false; btn.textContent = 'Reset Password';
        });
      });
    }
  })();
  </script>

  <div id="site-footer"></div>
    <script src="/js/loading-screen.js"></script>
<script src="/js/site.js"></script>
<script src="/js/install.js" defer></script>
<script src="/js/footer.js" defer></script>
<script src="/js/sw-register.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
</body>
</html>
