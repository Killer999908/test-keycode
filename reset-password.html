<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - KEYCODE Studio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --void: #030305;
      --graphite: #12121a;
      --slate: #1a1a24;
      --primary: #6366f1;
      --white: #ffffff;
      --ash: #d1d5db;
      --success: #10b981;
      --danger: #ef4444;
      --gradient-1: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      --font-display: 'Syne', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: var(--void);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(17, 17, 23, 0.95);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 0 80px rgba(99, 102, 241, 0.15);
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo-text {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 800;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 { font-family: var(--font-display); font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    p { text-align: center; color: var(--ash); font-size: 14px; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: var(--ash); margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 14px 16px;
      background: var(--slate);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
      color: var(--white);
      font-size: 15px;
      transition: all 0.3s;
    }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
    .btn {
      width: 100%;
      padding: 16px;
      background: var(--gradient-1);
      border: none;
      border-radius: 12px;
      color: white;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4); }
    .back-link { display: block; text-align: center; margin-top: 24px; color: var(--primary); text-decoration: none; font-size: 14px; }
    .back-link:hover { color: var(--ash); }
    .message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .message.success { display: block; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: var(--success); }
    .message.error { display: block; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><span class="logo-text">KEYCODE</span></div>
    <h1>Reset Password</h1>
    <p id="subtitle">Enter your new password</p>

    <div id="message" class="message"></div>

    <form id="resetForm">
      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" placeholder="Min. 8 characters" required minlength="8">
      </div>
      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" placeholder="Confirm new password" required>
      </div>
      <button type="submit" class="btn">Reset Password</button>
    </form>

    <form id="emailForm" style="display:none;">
      <p>Enter your email to receive a reset link:</p>
      <div class="form-group" style="margin-top:20px;">
        <input type="email" id="email" placeholder="Your email address" required>
      </div>
      <button type="submit" class="btn">Send Reset Link</button>
    </form>

    <a href="login.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Login</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');

    if (token && email) {
      document.getElementById('resetForm').style.display = 'block';
      document.getElementById('emailForm').style.display = 'none';
      document.getElementById('subtitle').textContent = 'Enter your new password';
    } else {
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('emailForm').style.display = 'block';
      document.getElementById('subtitle').textContent = 'Enter your email to reset';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('message');
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        msg.className = 'message error';
        msg.textContent = 'Passwords do not match';
        return;
      }

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, token, password })
        });
        const data = await res.json();
        if (res.ok) {
          msg.className = 'message success';
          msg.textContent = data.message || 'Password reset! Redirecting...';
          setTimeout(() => window.location.href = 'login.html', 2000);
        } else {
          msg.className = 'message error';
          msg.textContent = data.error || 'Reset failed';
        }
      } catch (err) {
        msg.className = 'message error';
        msg.textContent = 'Network error';
      }
    });

    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('message');
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value })
        });
        const data = await res.json();
        msg.className = 'message success';
        msg.textContent = data.message || 'Check your email for reset link';
      } catch (err) {
        msg.className = 'message error';
        msg.textContent = 'Network error';
      }
    });
  </script>
</body>
</html>
