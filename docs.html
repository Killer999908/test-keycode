  <style>
    :root {
      --bg: #0a0a1a;
      --sidebar-bg: #0d0d24;
      --card: #12122a;
      --primary: #ffffff;
      --accent: #22d3ee;
      --text: #e2e8f0;
      --ash: #94a3b8;
      --code-bg: #1a1a2e;
      --border: rgba(255, 255, 255, 0.06);
      --radius: 10px;
      --sidebar-w: 280px;
      --toc-w: 220px;
      --header-h: 80px;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }
    ::selection { background: var(--primary); color: #fff; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.5); }
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: var(--accent); }

    /* Header */
    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--header-h);
      background: rgba(10, 10, 26, 0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 20px;
    }
    .header-logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 1.1rem; color: var(--text);
    }
    .header-logo img { height: 28px; width: auto; }
    .header-logo span { color: var(--primary); }
    .header-links { margin-left: auto; display: flex; gap: 24px; align-items: center; }
    .header-links a { font-size: 0.875rem; color: var(--ash); transition: color 0.2s; }
    .header-links a:hover { color: var(--text); }
    .hamburger {
      display: none; background: none; border: none; color: var(--text);
      font-size: 1.25rem; cursor: pointer; padding: 6px; margin-left: auto;
    }
    .hamburger:focus { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

    /* Sidebar */
    .sidebar {
      position: fixed; top: var(--header-h); left: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      z-index: 50;
      transition: transform 0.3s ease;
      display: flex; flex-direction: column;
    }
    .sidebar-inner { padding: 16px 12px 32px; flex: 1; }

    .sidebar-search {
      position: relative; margin-bottom: 16px;
    }
    .sidebar-search .fa-magnifying-glass {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--ash); font-size: 0.8rem; pointer-events: none;
    }
    .sidebar-search input {
      width: 100%; padding: 10px 12px 10px 34px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 0.85rem;
      outline: none; transition: border-color 0.2s;
    }
    .sidebar-search input:focus { border-color: var(--primary); }
    .sidebar-search input::placeholder { color: var(--ash); }

    .nav-section { margin-bottom: 4px; }
    .nav-section-title {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--ash); cursor: default;
    }
    .nav-section-title i { width: 16px; text-align: center; font-size: 0.7rem; color: var(--primary); }
    .nav-item {
      display: block; padding: 7px 12px 7px 36px;
      font-size: 0.85rem; color: var(--ash);
      border-radius: 6px; cursor: pointer; transition: all 0.15s;
      text-decoration: none; position: relative;
    }
    .nav-item:hover { color: var(--text); background: rgba(99, 102, 241, 0.08); }
    .nav-item.active {
      color: #fff; background: rgba(99, 102, 241, 0.15);
    }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 4px; bottom: 4px;
      width: 3px; background: var(--primary); border-radius: 0 3px 3px 0;
    }
    .nav-item[style*="display: none"] + .nav-item[style*="display: none"] { display: none; }

    /* Main */
    .main-wrap {
      display: flex; margin-left: 280px;
      min-height: calc(100vh - 80px);
    }
    .main-content {
      flex: 1; max-width: 860px;
      padding: 40px 48px 80px;
      min-width: 0;
    }

    /* Right TOC */
    .toc {
      width: var(--toc-w);
      position: sticky; top: var(--header-h);
      align-self: flex-start;
      padding: 40px 16px 40px 0;
      flex-shrink: 0;
      max-height: calc(100vh - var(--header-h));
      overflow-y: auto;
    }
    .toc-label {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--ash); margin-bottom: 12px;
      padding-left: 12px;
    }
    .toc-link {
      display: block; padding: 4px 12px; font-size: 0.8rem;
      color: var(--ash); border-left: 2px solid transparent;
      transition: all 0.15s; text-decoration: none;
      line-height: 1.5;
    }
    .toc-link:hover { color: var(--text); border-color: var(--ash); }
    .toc-link.active { color: var(--primary); border-color: var(--primary); }
    .toc-link.toc-h3 { padding-left: 24px; font-size: 0.75rem; }

    /* Typography in content */
    .content h1 {
      font-size: 2rem; font-weight: 800; margin-bottom: 8px;
      letter-spacing: -0.02em; line-height: 1.3;
    }
    .content h1 + p { color: var(--ash); font-size: 1.1rem; margin-bottom: 32px; }
    .content h2 {
      font-size: 1.4rem; font-weight: 700; margin: 40px 0 12px;
      letter-spacing: -0.01em; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .content h3 {
      font-size: 1.1rem; font-weight: 600; margin: 28px 0 10px;
      color: var(--accent);
    }
    .content p { margin-bottom: 16px; color: var(--ash); line-height: 1.8; }
    .content strong { color: var(--text); font-weight: 600; }
    .content ul, .content ol { margin: 0 0 16px 20px; color: var(--ash); }
    .content li { margin-bottom: 6px; }
    .content hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

    /* Code blocks */
    .code-wrap {
      margin: 16px 0 24px; border-radius: var(--radius);
      overflow: hidden; background: var(--code-bg);
      border: 1px solid var(--border);
    }
    .code-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 14px; background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem; color: var(--ash);
    }
    .code-header .lang-label { font-weight: 500; }
    .code-header .copy-btn {
      background: none; border: none; color: var(--ash); cursor: pointer;
      font-size: 0.8rem; padding: 4px 8px; border-radius: 4px;
      transition: all 0.15s; font-family: inherit;
      display: flex; align-items: center; gap: 5px;
    }
    .code-header .copy-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .code-header .copy-btn.copied { color: #22c55e; }
    .code-wrap pre {
      padding: 16px 18px; overflow-x: auto; margin: 0;
      font-family: 'JetBrains Mono', monospace; font-size: 0.82rem;
      line-height: 1.6; color: #e2e8f0;
      tab-size: 2;
    }
    .code-wrap code { font-family: inherit; }

    /* Cards */
    .card {
      background: var(--card); border-radius: var(--radius);
      border: 1px solid var(--border); padding: 20px 24px;
      margin: 16px 0 24px;
    }
    .card-title { font-weight: 600; font-size: 1rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .card-title i { color: var(--primary); }

    /* Step cards */
    .step { display: flex; gap: 16px; margin-bottom: 24px; }
    .step-num {
      flex-shrink: 0; width: 32px; height: 32px;
      background: var(--primary); color: #fff;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem; margin-top: 2px;
    }
    .step-body { flex: 1; }
    .step-body h3 { margin-top: 0; }
    .step-body p { margin-bottom: 8px; }

    /* Method badges */
    .method {
      display: inline-block; font-size: 0.7rem; font-weight: 700;
      padding: 2px 8px; border-radius: 4px; text-transform: uppercase;
      letter-spacing: 0.03em; font-family: 'JetBrains Mono', monospace;
    }
    .method.get { background: rgba(34, 211, 238, 0.15); color: #22d3ee; }
    .method.post { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
    .method.put { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
    .method.delete { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .method.patch { background: rgba(251, 146, 60, 0.15); color: #fb923c; }

    .endpoint {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
    }
    .endpoint-path { color: var(--text); word-break: break-all; }

    .api-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 12px;
      overflow: hidden; transition: border-color 0.2s;
    }
    .api-item:hover { border-color: rgba(99, 102, 241, 0.3); }
    .api-summary {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; cursor: pointer;
      user-select: none;
    }
    .api-summary .chevron { margin-left: auto; color: var(--ash); transition: transform 0.2s; font-size: 0.8rem; }
    .api-summary.open .chevron { transform: rotate(90deg); }
    .api-detail { display: none; padding: 0 18px 18px; }
    .api-detail.open { display: block; }
    .api-detail h4 { font-size: 0.8rem; color: var(--ash); text-transform: uppercase; letter-spacing: 0.05em; margin: 12px 0 6px; }
    .api-detail p { font-size: 0.85rem; margin-bottom: 8px; }
    .param-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin: 8px 0 12px; }
    .param-table th { text-align: left; color: var(--ash); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); }
    .param-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); color: var(--text); }
    .param-table .param-req { color: #ef4444; font-size: 0.7rem; }
    .param-table .param-opt { color: var(--ash); font-size: 0.7rem; }
    .param-table .param-type { color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }

    /* Loading states */
    .loading-dots { display: flex; gap: 6px; align-items: center; padding: 20px 0; }
    .loading-dots span {
      width: 8px; height: 8px; background: var(--primary);
      border-radius: 50%; animation: bounce 1s infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%,80%,100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

    .error-msg {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2);
      border-radius: var(--radius); padding: 16px 20px; color: #fca5a5;
      margin: 16px 0; font-size: 0.85rem;
    }
    .error-msg i { margin-right: 8px; }

    /* Blog card */
    .blog-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 22px; margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .blog-card:hover { border-color: rgba(99,102,241,0.3); }
    .blog-card h3 { margin: 0 0 4px; font-size: 1rem; }
    .blog-card .blog-meta { font-size: 0.78rem; color: var(--ash); display: flex; gap: 12px; margin-bottom: 8px; }
    .blog-card .blog-meta .cat { color: var(--accent); }
    .blog-card p { font-size: 0.85rem; margin: 0; }

    /* FAQ */
    .faq-item { border-bottom: 1px solid var(--border); }
    .faq-q {
      padding: 14px 0; display: flex; justify-content: space-between;
      align-items: center; cursor: pointer; font-weight: 500;
      user-select: none;
    }
    .faq-q i { color: var(--ash); transition: transform 0.2s; font-size: 0.8rem; }
    .faq-q.open i { transform: rotate(45deg); }
    .faq-a { display: none; padding: 0 0 14px; color: var(--ash); font-size: 0.9rem; }
    .faq-a.open { display: block; }

    /* Contact */
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
    .contact-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; text-align: center;
      transition: border-color 0.2s;
    }
    .contact-card:hover { border-color: rgba(99,102,241,0.3); }
    .contact-card i { font-size: 1.5rem; color: var(--primary); margin-bottom: 8px; }
    .contact-card h4 { font-size: 0.9rem; margin-bottom: 4px; }
    .contact-card p { font-size: 0.82rem; margin: 0; }

    /* Empty / no results */
    .no-results { text-align: center; padding: 40px 20px; color: var(--ash); }
    .no-results i { font-size: 2rem; margin-bottom: 12px; color: var(--border); }

    /* Mobile overlay */
    .sidebar-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 45;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .toc { display: none; }
      .main-content { padding: 32px 28px 60px; max-width: 100%; }
    }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      .hamburger { display: block; }
      .main-wrap { margin-left: 0; }
      .main-content { padding: 24px 18px 60px; }
      .contact-grid { grid-template-columns: 1fr; }
