<style>
:root{--bg:#0a0a1a;--card:#12122a;--card-hover:#1a1a3a;--primary:#ffffff;--accent:#22d3ee;--text:#e2e8f0;--ash:#94a3b8;--success:#10b981;--error:#ef4444;--warning:#f59e0b;--border:rgba(255,255,255,0.06);--sidebar-w:250px;--header-h:64px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--card-hover);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--ash)}
a{color:inherit;text-decoration:none}
input,textarea,select,button{font-family:inherit}

/* Sidebar */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--card);border-right:1px solid var(--border);z-index:100;display:flex;flex-direction:column;transition:.3s}
.sidebar-logo{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-logo .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;color:white}
.sidebar-logo span{font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto}
.sidebar-label{font-size:10px;text-transform:uppercase;color:rgba(255,255,255,0.2);padding:16px 12px 6px;letter-spacing:1.5px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;color:var(--ash);cursor:pointer;transition:.2s;font-size:13px;margin-bottom:2px;text-decoration:none;position:relative}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text)}
.nav-item.active{background:rgba(99,102,241,0.1);color:var(--primary)}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--primary);border-radius:0 4px 4px 0}
.nav-item i{width:18px;text-align:center;font-size:14px}
.sidebar-footer{padding:16px;border-top:1px solid var(--border)}
.user-card{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;cursor:pointer;transition:.2s}
.user-card:hover{background:rgba(255,255,255,0.04)}
.user-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:13px;color:white;font-weight:700;flex-shrink:0}
.user-info{flex:1;min-width:0}
.fab-credit-chip{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:2px 7px;border-radius:10px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35);font-size:10px;font-weight:600;color:#10b981;letter-spacing:.02em}
.user-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-email{font-size:11px;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Main */
.main{margin-left:var(--sidebar-w);min-height:100vh}
.header{height:var(--header-h);padding:0 32px;background:rgba(10,10,26,0.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.header-left{display:flex;align-items:center;gap:16px}
.header-left h1{font-size:18px;font-weight:700;color:var(--text)}
.header-breadcrumb{font-size:12px;color:var(--ash);display:flex;align-items:center;gap:6px}
.header-breadcrumb .current{color:var(--primary)}
.header-right{display:flex;align-items:center;gap:10px}
.header-btn{padding:8px 14px;border-radius:8px;background:var(--card-hover);border:1px solid var(--border);color:var(--ash);font-size:12px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-family:inherit}
.header-btn:hover{background:rgba(255,255,255,0.06);color:var(--text)}
.header-btn.primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:white;border:none}
.header-btn.primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(99,102,241,0.3)}

/* Content */
.content{padding:28px 32px}

/* Section Tabs (mobile) */
.mobile-tabs{display:none;overflow-x:auto;gap:4px;padding:8px 0;margin-bottom:16px;white-space:nowrap;-webkit-overflow-scrolling:touch}
.mobile-tab{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:500;color:var(--ash);background:var(--card);border:1px solid var(--border);cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.mobile-tab:hover{background:var(--card-hover);color:var(--text)}
.mobile-tab.active{background:rgba(99,102,241,0.15);color:var(--primary);border-color:rgba(99,102,241,0.3)}

/* Sections */
.section{padding:0 0 32px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.section-header h2{font-size:20px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.section-header h2 i{color:var(--primary)}
.section-header .subtitle{font-size:12px;color:var(--ash);font-weight:400}
.section-desc{font-size:13px;color:var(--ash);margin-bottom:20px;line-height:1.5}

/* Card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:.2s}
.card:hover{border-color:rgba(255,255,255,0.08)}
.card-body{padding:24px}
.card-body.compact{padding:16px 20px}

/* Form */
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:12px;color:var(--ash);margin-bottom:5px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;background:var(--card-hover);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:.2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,0.1)}
.form-group input:disabled,.form-group input[readonly]{opacity:.6;cursor:not-allowed}
.form-group textarea{min-height:80px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}

/* Buttons */
.btn{padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.3s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:white}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(99,102,241,0.3)}
.btn-secondary{background:var(--card-hover);border:1px solid var(--border);color:var(--ash)}
.btn-secondary:hover{background:rgba(255,255,255,0.06);color:var(--text)}
.btn-success{background:var(--success);color:white}
.btn-success:hover{opacity:.9}
.btn-danger{background:var(--error);color:white}
.btn-danger:hover{opacity:.9}
.btn-warning{background:var(--warning);color:white}
.btn-warning:hover{opacity:.9}
.btn-sm{padding:6px 14px;font-size:11px;border-radius:8px}
.btn-xs{padding:4px 10px;font-size:10px;border-radius:6px}
.btn-icon{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--ash);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:4px;font-size:12px}
.btn-icon:hover{background:var(--card-hover);color:var(--text)}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;gap:4px}
.badge-success{background:rgba(16,185,129,0.12);color:var(--success)}
.badge-warning{background:rgba(245,158,11,0.12);color:var(--warning)}
.badge-danger{background:rgba(239,68,68,0.12);color:var(--error)}
.badge-info{background:rgba(99,102,241,0.12);color:var(--primary)}
.badge-secondary{background:rgba(255,255,255,0.06);color:var(--ash)}
.badge-accent{background:rgba(34,211,238,0.12);color:var(--accent)}

/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 16px;font-size:11px;text-transform:uppercase;color:var(--ash);letter-spacing:.5px;border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap}
td{padding:12px 16px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.03)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.015)}

/* Loading Skeleton */
.skeleton{background:linear-gradient(90deg,var(--card-hover) 25%,rgba(255,255,255,0.04) 50%,var(--card-hover) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
.skeleton-line{height:14px;margin-bottom:10px;border-radius:6px}
.skeleton-line:last-child{margin-bottom:0}
.skeleton-block{height:40px;border-radius:10px;margin-bottom:12px}
.skeleton-avatar{width:80px;height:80px;border-radius:50%;flex-shrink:0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Loading spinner */
.loading{text-align:center;padding:40px;color:var(--ash)}
.loading i{font-size:20px}

/* Empty state */
.empty-state{text-align:center;padding:48px 20px;color:var(--ash)}
.empty-state i{font-size:36px;opacity:.25;margin-bottom:8px}
.empty-state p{font-size:13px;margin-bottom:12px}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);padding:12px 28px;border-radius:12px;font-size:13px;font-weight:500;z-index:9999;color:white;box-shadow:0 8px 40px rgba(0,0,0,0.5);animation:slideUpToast .3s ease;display:flex;align-items:center;gap:8px;max-width:90vw}
.toast.success{background:linear-gradient(135deg,var(--success),#059669)}
.toast.error{background:linear-gradient(135deg,var(--error),#dc2626)}
.toast.warning{background:linear-gradient(135deg,var(--warning),#d97706)}
@keyframes slideUpToast{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;max-width:520px;width:92%;padding:28px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:17px;font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.modal p.sub{font-size:13px;color:var(--ash);margin-bottom:20px}
.modal .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

/* Confirm dialog */
.confirm-body{text-align:center;padding:8px 0}
.confirm-body i{font-size:40px;margin-bottom:12px}
.confirm-body p{font-size:14px;color:var(--ash);line-height:1.5}

/* Avatar upload */
.avatar-section{display:flex;align-items:center;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.avatar-preview{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:32px;color:white;font-weight:700;overflow:hidden;flex-shrink:0;position:relative}
.avatar-preview img{width:100%;height:100%;object-fit:cover}
.avatar-preview .avatar-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;cursor:pointer;font-size:14px}
.avatar-preview:hover .avatar-overlay{opacity:1}
.avatar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Profile info grid */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:640px){.info-grid{grid-template-columns:1fr}}
.info-item{background:var(--card-hover);border-radius:10px;padding:14px}
.info-item .info-label{font-size:11px;color:var(--ash);margin-bottom:2px;font-weight:500}
.info-item .info-value{font-size:14px;color:var(--text);font-weight:500;word-break:break-all}

/* Password strength */
.pw-strength{display:flex;gap:6px;margin-top:8px}
.pw-bar{flex:1;height:4px;border-radius:4px;background:var(--card-hover);transition:.3s}
.pw-bar.active.weak{background:var(--error)}
.pw-bar.active.medium{background:var(--warning)}
.pw-bar.active.strong{background:var(--success)}
.pw-label{font-size:11px;margin-top:4px;font-weight:500}

/* Verification badge */
.verified-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.verified-badge.verified{background:rgba(16,185,129,0.12);color:var(--success)}
.verified-badge.unverified{background:rgba(239,68,68,0.1);color:var(--error)}

/* API Keys */
.api-key-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card-hover);border-radius:10px;margin-bottom:8px;transition:.2s;flex-wrap:wrap}
.api-key-item:hover{background:rgba(255,255,255,0.04)}
.api-key-info{flex:1;min-width:150px}
.api-key-name{font-size:13px;font-weight:600;color:var(--text)}
.api-key-meta{font-size:11px;color:var(--ash);margin-top:2px}
.api-key-value{font-family:'SF Mono','Fira Code',monospace;font-size:12px;color:var(--accent);background:rgba(34,211,238,0.06);padding:6px 12px;border-radius:6px;border:1px solid rgba(34,211,238,0.1);word-break:break-all}
.api-key-actions{display:flex;gap:6px;flex-wrap:wrap}

/* Referral */
.referral-code{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--card-hover);border:2px dashed rgba(99,102,241,0.2);border-radius:12px;flex-wrap:wrap}
.referral-code .code{font-size:24px;font-weight:800;letter-spacing:4px;color:var(--primary);font-family:'SF Mono','Fira Code',monospace}
.referral-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:20px 0}
.referral-stat{background:var(--card-hover);border-radius:12px;padding:18px;text-align:center}
.referral-stat .r-val{font-size:28px;font-weight:800;color:var(--text)}
.referral-stat .r-label{font-size:11px;color:var(--ash);margin-top:4px}
.share-buttons{display:flex;gap:8px;flex-wrap:wrap}

/* Notifications */
.notif-toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card-hover);border-radius:10px;margin-bottom:6px;gap:12px;flex-wrap:wrap}
.notif-toggle .notif-info{flex:1}
.notif-toggle .notif-title{font-size:13px;font-weight:600;color:var(--text)}
.notif-toggle .notif-desc{font-size:11px;color:var(--ash);margin-top:2px}
.toggle-switch{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--card-hover);border-radius:24px;cursor:pointer;transition:.3s;border:1px solid var(--border)}
.toggle-slider::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:var(--ash);top:2px;left:2px;transition:.3s}
.toggle-switch input:checked+.toggle-slider{background:rgba(99,102,241,0.3);border-color:var(--primary)}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(20px);background:var(--primary)}

/* Project grid */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.proj-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;transition:.3s;cursor:pointer}
.proj-card:hover{transform:translateY(-2px);border-color:rgba(99,102,241,0.2);box-shadow:0 8px 30px rgba(0,0,0,0.2)}
.proj-card .proj-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px}
.proj-card .proj-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.proj-card .proj-meta{font-size:11px;color:var(--ash);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Billing */
.plan-card{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;background:linear-gradient(135deg,rgba(99,102,241,0.06),rgba(34,211,238,0.06));border:1px solid rgba(99,102,241,0.15);border-radius:12px;margin-bottom:16px;gap:16px;flex-wrap:wrap}
.plan-card .plan-name{font-size:16px;font-weight:700;color:var(--text)}
.plan-card .plan-price{font-size:12px;color:var(--ash);margin-top:2px}
.payment-method{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card-hover);border-radius:10px;margin-bottom:8px}
.payment-method .pm-icon{font-size:20px;color:var(--ash);width:32px;text-align:center}
.payment-method .pm-info{flex:1}
.payment-method .pm-name{font-size:13px;font-weight:600;color:var(--text)}
.payment-method .pm-desc{font-size:11px;color:var(--ash)}

/* Page visibility */
.page{display:none}.page.active{display:block}

/* Not logged in */
.not-logged-in{display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px}
.not-logged-in .nl-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:48px 40px;max-width:400px}
.not-logged-in .nl-card i{font-size:40px;color:var(--primary);margin-bottom:12px}
.not-logged-in .nl-card h2{font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px}
.not-logged-in .nl-card p{font-size:13px;color:var(--ash);margin-bottom:20px}

/* Orders table status dots */
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px}
.status-dot.completed{background:var(--success)}
.status-dot.pending{background:var(--warning)}
.status-dot.cancelled{background:var(--error)}
.status-dot.processing{background:var(--primary)}

/* Responsive */
@media(max-width:768px){
  .sidebar{width:64px}.sidebar-logo span,.sidebar-label,.nav-item span,.user-info{display:none}
  .nav-item{padding:10px;justify-content:center}.nav-item.active::before{left:-9px}
  .sidebar-footer{padding:8px}.user-card{padding:8px;justify-content:center}
  .main{margin-left:64px}.content{padding:16px}
  .header{padding:0 16px}.header-left h1{font-size:15px}.header-btn span{display:none}
  .mobile-tabs{display:flex}
}
@media(max-width:480px){
  .sidebar{display:none}.main{margin-left:0}.mobile-tabs{padding:8px 12px}.avatar-section{flex-direction:column;align-items:flex-start}
}
</style>
