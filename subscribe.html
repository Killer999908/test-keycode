<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Secure KEYCODE Studio subscription checkout.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Secure subscription checkout — KEYCODE Studio</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #080808; color: #f5f5f5; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% -15%, #252525, #080808 60%); }
    main { width: min(100%, 520px); padding: clamp(24px, 6vw, 44px); border: 1px solid #ffffff20; border-radius: 18px; background: #111; box-shadow: 0 22px 80px #0008; }
    .brand { color: #aaa; font: 11px/1.4 ui-monospace, monospace; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 15px 0 8px; font-size: clamp(28px, 7vw, 38px); letter-spacing: -.04em; }
    .copy, .notice { color: #aaa; font-size: 14px; line-height: 1.65; }
    .plan { margin: 26px 0 20px; padding: 17px; border: 1px solid #ffffff1a; border-radius: 10px; background: #ffffff08; }
    .plan strong { display: block; margin-bottom: 5px; font-size: 18px; }
    .button { width: 100%; min-height: 48px; padding: 13px 18px; border: 0; border-radius: 8px; background: #f5f5f5; color: #111; font: 700 12px/1.3 ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
    .button:disabled { cursor: wait; opacity: .55; }
    .secondary { display: block; margin-top: 18px; color: #bbb; font-size: 13px; text-align: center; }
    .secondary a { color: #fff; }
    #notice { min-height: 24px; margin-top: 15px; font-size: 13px; line-height: 1.5; }
    #notice[data-kind="error"] { color: #ff9d9d; }
    #notice[data-kind="success"] { color: #d9f5dc; }
  </style>
</head>
<body>
  <main>
    <div class="brand">KEYCODE Studio · Secure checkout</div>
    <h1 id="title">Your plan</h1>
    <p class="copy">Continue to Stripe’s secure checkout to pay and start the subscription. Your account is upgraded only after Stripe confirms payment.</p>
    <div class="plan">
      <strong id="planName">Loading plan…</strong>
      <span id="billingLabel" class="copy"></span>
    </div>
    <button id="checkout" class="button" type="button">Continue to secure payment</button>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <div class="secondary"><a href="/pricing.html">Back to plans</a> · <a href="/">Home</a></div>
  </main>
  <script>
    (function () {
      'use strict';
      var params = new URLSearchParams(location.search);
      var plan = (params.get('plan') || '').trim().toLowerCase();
      var interval = ['yearly', 'annual'].includes(params.get('interval')) ? 'yearly' : 'monthly';
      var token = localStorage.getItem('token') || '';
      var button = document.getElementById('checkout');
      var notice = document.getElementById('notice');
      var selected = null;
      var isReturning = params.get('checkout') === 'success' && Boolean(params.get('session_id'));
      button.disabled = true;
      fetch('/api/services').then(function (response) {
        if (!response.ok) throw new Error('Could not load the current plan catalog.');
        return response.json();
      }).then(function (result) {
        selected = (result.services || []).find(function (item) {
          return item && [item.slug, item._id, item.name].some(function (value) {
            return String(value || '').toLowerCase() === plan;
          }) && Number(item.basePrice) > 0;
        }) || null;
        if (!selected) throw new Error('That paid plan is not available. Choose a plan from the pricing page.');
        document.getElementById('planName').textContent = selected.name;
        // The price the server resolves for this visitor's region is the price
        // checkout charges, so display it with the region's own symbol.
        var symbol = selected.symbol || (result.region && result.region.symbol) || '$';
        var monthly = Number(selected.basePrice);
        document.getElementById('billingLabel').textContent = interval === 'yearly'
          ? symbol + (monthly * 0.8).toFixed(2) + '/mo equivalent · ' + symbol + (monthly * 9.6).toFixed(2) + ' billed yearly'
          : symbol + monthly.toFixed(2) + ' billed monthly';
        if (result.region && result.region.regional) {
          notice.textContent = 'Showing ' + result.region.label + ' pricing in ' + result.region.currency + '.';
        }
        if (!isReturning) button.disabled = false;
      }).catch(function (error) {
        document.getElementById('planName').textContent = 'Select a plan';
        notice.dataset.kind = 'error';
        notice.textContent = error.message;
      });
      if (params.get('checkout') === 'cancel') {
        notice.textContent = 'Checkout was cancelled. You have not been charged and your plan has not changed.';
      }

      async function verifyCheckout(sessionId) {
        button.disabled = true;
        button.textContent = 'Verifying payment…';
        notice.textContent = 'Checking payment status with Stripe. Your plan will not activate unless payment is confirmed.';
        try {
          var response = await fetch('/api/subscriptions/checkout/' + encodeURIComponent(sessionId) + '/verify', {
            headers: { Authorization: 'Bearer ' + token }
          });
          var result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Could not verify payment.');
          if (result.active) {
            notice.dataset.kind = 'success';
            notice.textContent = 'Payment verified. Your ' + result.subscription.plan + ' plan is active.';
            button.textContent = 'Payment verified';
          } else {
            notice.textContent = 'Payment is not confirmed yet. Your plan is still unchanged. Refresh this page in a moment.';
            button.disabled = false;
            button.textContent = 'Check payment again';
            button.onclick = function () { verifyCheckout(sessionId); };
          }
        } catch (error) {
          notice.dataset.kind = 'error';
          notice.textContent = error.message;
          button.disabled = false;
          button.textContent = 'Check payment again';
          button.onclick = function () { verifyCheckout(sessionId); };
        }
      }

      if (isReturning) {
        if (!token) {
          notice.dataset.kind = 'error';
          notice.textContent = 'Sign in to the same account used for checkout, then return here to verify payment.';
          button.disabled = true;
        } else {
          verifyCheckout(params.get('session_id'));
        }
      }

      button.addEventListener('click', async function () {
        if (!selected || button.onclick) return;
        if (!token) {
          notice.dataset.kind = 'error';
          notice.innerHTML = 'Sign in before subscribing. <a href="/login.html?redirect=%2Fpricing.html">Sign in</a>';
          return;
        }
        button.disabled = true;
        button.textContent = 'Connecting to Stripe…';
        notice.textContent = '';
        try {
          var response = await fetch('/api/subscriptions/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ plan: selected.slug || selected._id, interval: interval })
          });
          var result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Could not start checkout.');
          if (!result.checkoutUrl) throw new Error('Stripe did not return a secure checkout URL.');
          location.assign(result.checkoutUrl);
        } catch (error) {
          notice.dataset.kind = 'error';
          notice.textContent = error.message;
          button.disabled = false;
          button.textContent = 'Continue to secure payment';
        }
      });
    })();
  </script>
</body>
</html>
