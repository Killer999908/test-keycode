  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap');
    :root {
      --bg: #000;
      --card: #0a0a0a;
      --primary: #fff;
      --accent: #fff;
      --text: #fff;
      --ash: #7E7E7E;
      --void: #000;
      --obsidian: #000;
      --graphite: #0a0a0a;
      --slate: #111;
      --danger: #fff;
      --success: #fff;
      --warning: #fff;
      --white: #ffffff;
      --glass: rgba(255,255,255,.05);
      --glass-border: rgba(255,255,255,.1);
      --font-body: 'Inter', sans-serif;
      --font-display: 'Syne', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--glass-border);
    }
    .gallery-header .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .gallery-header .logo-area img {
      height: 32px;
      width: auto;
    }
    .gallery-header .logo-area h1 {
      font-size: 18px;
      font-weight: 700;
      font-family: var(--font-display);
      color: var(--white);
    }
    .gallery-header .logo-area h1 span {
      color: var(--white);
    }
    .gallery-header .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .gallery-header .header-actions a {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ash);
      transition: .3s;
    }
    .gallery-header .header-actions a:hover {
      color: var(--white);
      background: rgba(255,255,255,0.06);
    }
    .gallery-header .header-actions .btn-primary {
      background: var(--white);
      color: #000;
      padding: 8px 20px;
      border-radius: 10px;
      font-weight: 600;
      border: 1px solid var(--white);
    }
    .gallery-header .header-actions .btn-primary:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .gallery-main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .filter-bar .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .filter-btn {
      padding: 8px 18px;
      border-radius: 100px;
      border: 1px solid var(--glass-border);
      background: transparent;
      color: var(--ash);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: .3s;
      font-family: var(--font-body);
      white-space: nowrap;
    }
    .filter-btn:hover {
      border-color: rgba(255,255,255,0.3);
      color: var(--white);
    }
    .filter-btn.active {
      background: var(--white);
      border-color: var(--white);
      color: #000;
    }
    .filter-btn.active:hover {
      opacity: 0.85;
    }
    .filter-search {
      margin-left: auto;
      position: relative;
    }
    .filter-search input {
      padding: 8px 16px 8px 38px;
      border-radius: 100px;
      border: 1px solid var(--glass-border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-family: var(--font-body);
      outline: none;
      transition: .3s;
      width: 240px;
    }
    .filter-search input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.1);
    }
    .filter-search input::placeholder { color: var(--ash); }
    .filter-search i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ash);
      font-size: 14px;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .project-card {
      background: var(--card);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 20px;
      transition: .3s;
      display: flex;
      flex-direction: column;
    }
    .project-card:hover {
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .project-card .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .project-card .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      flex-shrink: 0;
      background: #7E7E7E !important;
    }
    .project-card .badge {
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
      background: rgba(255,255,255,.1) !important;
      color: #fff !important;
    }
    .project-card .card-body {
      flex: 1;
    }
    .project-card .card-desc {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .project-card .card-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--glass-border);
    }
    .project-card .card-meta .meta-item {
      display: flex;
      flex-direction: column;
    }
    .project-card .card-meta .meta-item .meta-label {
      font-size: 11px;
      color: var(--ash);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }
    .project-card .card-meta .meta-item .meta-value {
      font-size: 13px;
      color: var(--text);
      font-weight: 500;
      word-break: break-all;
    }
    .project-card .card-meta .meta-item .meta-value.file-id {
      font-family: monospace;
      font-size: 12px;
      color: var(--ash);
    }
    .project-card .card-actions {
      margin-top: auto;
    }
    .project-card .view-btn {
      display: block;
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--white);
      background: var(--white);
      color: #000;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: .3s;
      text-align: center;
      font-family: var(--font-body);
    }
    .project-card .view-btn:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .state-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      text-align: center;
    }
    .state-container i {
      font-size: 48px;
      color: var(--ash);
      margin-bottom: 16px;
      opacity: 0.5;
    }
    .state-container h3 {
      font-size: 20px;
      font-weight: 600;
      font-family: var(--font-display);
      color: var(--white);
      margin-bottom: 8px;
    }
    .state-container p {
      font-size: 14px;
      color: var(--ash);
      max-width: 400px;
      line-height: 1.6;
    }
    .state-container .retry-btn {
      margin-top: 20px;
      padding: 10px 24px;
      border-radius: 10px;
      border: 1px solid var(--white);
      background: var(--white);
      color: #000;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: .3s;
      font-family: var(--font-body);
    }
    .state-container .retry-btn:hover {
      opacity: 0.85;
    }
    .state-container .action-link {
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 10px;
      border: 1px solid var(--white);
      background: var(--white);
      color: #000;
      font-size: 14px;
      font-weight: 600;
      transition: .3s;
    }
    .state-container .action-link:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--glass-border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .result-count {
      font-size: 13px;
      color: var(--ash);
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .gallery-header {
        padding: 12px 16px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .gallery-header .logo-area h1 { font-size: 15px; }
      .gallery-header .header-actions a { font-size: 12px; padding: 6px 12px; }
      .gallery-main { padding: 20px 16px; }
      .filter-bar { flex-direction: column; align-items: stretch; }
      .filter-bar .filter-group { justify-content: center; }
      .filter-search { margin-left: 0; }
      .filter-search input { width: 100%; }
      .project-grid { grid-template-columns: 1fr; }
    }
  </style>
