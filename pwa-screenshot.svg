  <!-- Content -->
  <text x="240" y="180" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700" fill="#ffffff">KEYCODE Studio</text>
  <text x="240" y="220" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#22d3ee" font-weight="400" letter-spacing="1">AI-POWERED DIGITAL TRANSFORMATION</text>
