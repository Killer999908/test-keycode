<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0a0a1a"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#g)" opacity="0.1"/>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Browser mockup -->
  <rect x="80" y="60" width="1120" height="600" rx="12" fill="#12122a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Browser chrome -->
  <rect x="80" y="60" width="1120" height="40" rx="12" fill="#1a1a2e"/>
  <rect x="80" y="86" width="1120" height="14" fill="#1a1a2e"/>
  <circle cx="104" cy="80" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="124" cy="80" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="144" cy="80" r="6" fill="#10b981" opacity="0.8"/>
