  <text x="260" y="330" font-family="Inter" font-size="14" font-weight="600" fill="#e2e8f0">Websites</text>
  <text x="260" y="350" font-family="Inter" font-size="12" fill="#94a3b8">AI-generated landing pages</text>
  
  <rect x="490" y="260" width="220" height="140" rx="10" fill="#1a1a3a" stroke="rgba(34,211,238,0.2)" stroke-width="1"/>
  <text x="510" y="300" font-family="Inter" font-size="24" fill="#22d3ee">&#x1F9EA;</text>
  <text x="510" y="330" font-family="Inter" font-size="14" font-weight="600" fill="#e2e8f0">PCBs</text>
  <text x="510" y="350" font-family="Inter" font-size="12" fill="#94a3b8">Circuit board design</text>
  
  <rect x="740" y="260" width="220" height="140" rx="10" fill="#1a1a3a" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <text x="760" y="300" font-family="Inter" font-size="24" fill="#10b981">&#x1F4A0;</text>
  <text x="760" y="330" font-family="Inter" font-size="14" font-weight="600" fill="#e2e8f0">MCU Firmware</text>
  <text x="760" y="350" font-family="Inter" font-size="12" fill="#94a3b8">Microcontroller code</text>
  
  <!-- Bottom stats -->
  <rect x="240" y="430" width="720" height="60" rx="10" fill="#12122a" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="280" y="465" font-family="Inter" font-size="28" font-weight="700" fill="#6366f1">35+</text>
  <text x="280" y="480" font-family="Inter" font-size="11" fill="#94a3b8">Pages</text>
  <text x="440" y="465" font-family="Inter" font-size="28" font-weight="700" fill="#22d3ee">6</text>
  <text x="440" y="480" font-family="Inter" font-size="11" fill="#94a3b8">Languages</text>
  <text x="600" y="465" font-family="Inter" font-size="28" font-weight="700" fill="#10b981">543</text>
  <text x="600" y="480" font-family="Inter" font-size="11" fill="#94a3b8">RPS</text>
  <text x="760" y="465" font-family="Inter" font-size="28" font-weight="700" fill="#f59e0b">99.9%</text>
  <text x="760" y="480" font-family="Inter" font-size="11" fill="#94a3b8">Uptime</text>
  
