name: Full-Stack Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: fullstack-smoke
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "db.runCommand('ping').ok"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: '5000'
      MONGODB_URI: mongodb://localhost:27017/keycode-smoke
      JWT_SECRET: ci-smoke-secret-0123456789abcdef0123456789abcdef
      FRONTEND_URL: http://localhost:5000
      SMOKE_BASE: http://127.0.0.1:5000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Boot the full app against MongoDB
        run: |
          nohup node server.js > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          echo "server pid: $(cat /tmp/server.pid)"
        working-directory: server

      - name: Run full-stack smoke suite
        run: node scripts/ci-smoke.mjs
        working-directory: server

      - name: Dump server logs
        if: always()
        run: |
          echo "──── server.log (last 200 lines) ────"
          tail -n 200 /tmp/server.log || true
