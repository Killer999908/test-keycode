name: Full-Stack Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: fullstack-smoke
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: '5000'
      MONGODB_URI: mongodb://localhost:27017/keycode-smoke
      JWT_SECRET: ci-smoke-secret-0123456789abcdef0123456789abcdef
      FRONTEND_URL: http://localhost:5000
      SMOKE_BASE: http://127.0.0.1:5000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies (host, for build cache)
        run: npm ci
        working-directory: server

      - name: Start MongoDB + server via docker-compose
        run: |
          docker compose -f docker-compose.ci.yml up -d
          echo "waiting for MongoDB to become healthy..."
          for i in $(seq 1 30); do
            if docker exec ci-mongodb-1 mongosh --eval "db.runCommand('ping').ok" --quiet 2>/dev/null | grep -q 1; then
              echo "MongoDB is healthy after ${i} attempts"
              break
            fi
            echo "attempt ${i}/30 — waiting..."
            sleep 2
          done
          echo "waiting for server to respond on :5000..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:5000/api/health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "server is up after ${i} attempts"
              break
            fi
            echo "attempt ${i}/30 — waiting..."
            sleep 2
          done

      - name: Run full-stack smoke suite
        run: node scripts/ci-smoke.mjs
        working-directory: server

      - name: Dump server logs
        if: always()
        run: |
          echo "──── server.log (last 200 lines) ────"
          docker logs ci-server-1 2>/dev/null | tail -n 200 || true
          echo "──── docker compose ps ────"
          docker compose -f docker-compose.ci.yml ps || true

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v || true
