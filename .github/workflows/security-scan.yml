name: Security Scan
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 6AM UTC

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for secrets with truffleHog
        uses: trufflesecurity/trufflehog@v3
        with:
          extra_args: --only-verified

      - name: Run SRI checker
        run: |
          echo "Checking for CDN resources without SRI..."
          grep -rn 'src="https\?://' ../*.html | grep -v 'integrity=' | grep -v 'stripe.com' | grep -v 'fonts.googleapis.com' || echo "All non-dynamic CDN resources have SRI"

      - name: Run Snyk (if token available)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
