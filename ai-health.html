<style>
:root{--bg:#0a0a1a;--card:#12122a;--primary:#ffffff;--accent:#22d3ee;--text:#e2e8f0;--ash:#94a3b8;--success:#10b981;--error:#ef4444;--warning:#f59e0b;--surface:#181825;--glass:rgba(255,255,255,0.06);--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--card);border-radius:4px}

/* Header */
.header{background:rgba(10,10,26,0.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--glass);position:sticky;top:0;z-index:100;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
.header-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.logo-text{font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-right{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ash)}

/* Hero */
.hero{padding:40px 24px 20px;max-width:1200px;margin:0 auto;text-align:center}
.hero h1{font-size:32px;font-weight:800;margin-bottom:6px}
.hero p{font-size:14px;color:var(--ash);max-width:500px;margin:0 auto 20px;line-height:1.6}

/* Overall status badge */
.overall-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:100px;font-size:13px;font-weight:600;margin-bottom:20px}
.overall-badge .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.overall-badge.good{background:rgba(16,185,129,0.12);color:var(--success);border:1px solid rgba(16,185,129,0.2)}
.overall-badge.good .dot{background:var(--success);box-shadow:0 0 8px rgba(16,185,129,0.5)}
.overall-badge.degraded{background:rgba(245,158,11,0.12);color:var(--warning);border:1px solid rgba(245,158,11,0.2)}
.overall-badge.degraded .dot{background:var(--warning);box-shadow:0 0 8px rgba(245,158,11,0.5)}
.overall-badge.major{background:rgba(239,68,68,0.12);color:var(--error);border:1px solid rgba(239,68,68,0.2)}
.overall-badge.major .dot{background:var(--error);box-shadow:0 0 8px rgba(239,68,68,0.5)}

/* Controls */
.controls{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.countdown{font-size:13px;color:var(--ash);display:flex;align-items:center;gap:6px}
.refresh-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;border:1px solid var(--glass);background:var(--card);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;transition:.2s}
.refresh-btn:hover{background:rgba(255,255,255,0.06);border-color:rgba(99,102,241,0.3)}
.refresh-btn:disabled{opacity:.5;cursor:not-allowed}
.refresh-btn i{font-size:14px}
.refresh-btn .fa-spinner{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Grid */
.grid{max-width:1200px;margin:0 auto;padding:0 24px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

/* Card */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--glass);padding:20px;transition:.3s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-2px)}
.card.online{border-left:3px solid var(--success)}
.card.offline{border-left:3px solid var(--error)}
.card.degraded{border-left:3px solid var(--warning)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-name{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}
.card-name i{width:20px;text-align:center;font-size:16px;color:var(--primary)}
.status-indicator{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.online{background:var(--success);box-shadow:0 0 6px rgba(16,185,129,0.5)}
.status-dot.offline{background:var(--error);box-shadow:0 0 6px rgba(239,68,68,0.5)}
.status-dot.degraded{background:var(--warning);box-shadow:0 0 6px rgba(245,158,11,0.5)}
.card-details{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--ash)}
.card-details .label{color:rgba(148,163,184,0.6)}
.card-details .value{color:var(--text);font-weight:500}
.card-details .full{grid-column:1/-1}
.error-msg{font-size:12px;color:var(--error);margin-top:8px;padding:6px 10px;background:rgba(239,68,68,0.08);border-radius:6px;word-break:break-all}

/* History dots */
.history{display:flex;align-items:center;gap:4px;margin-top:12px;padding-top:12px;border-top:1px solid var(--glass)}
.history-label{font-size:10px;color:var(--ash);text-transform:uppercase;letter-spacing:.5px;margin-right:6px;opacity:.6}
.history-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.history-dot.online{background:var(--success)}
.history-dot.offline{background:var(--error)}
.history-dot.degraded{background:var(--warning)}
.history-dot.pending{background:var(--ash);opacity:.3}

/* Skeleton */
.skeleton{background:linear-gradient(90deg,var(--card) 25%,rgba(255,255,255,0.03) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--glass);padding:20px}
.skel-line{height:14px;border-radius:6px;margin-bottom:10px}
.skel-line.w50{width:50%}.skel-line.w30{width:30%}.skel-line.w70{width:70%}
.skel-line.w40{width:40%}.skel-line:last-child{margin-bottom:0}

/* Error state */
.error-state{text-align:center;padding:60px 24px;grid-column:1/-1}
.error-state i{font-size:40px;color:var(--error);margin-bottom:16px}
.error-state h3{font-size:18px;margin-bottom:6px}
.error-state p{font-size:13px;color:var(--ash);margin-bottom:20px}
.error-state .retry-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border-radius:8px;border:none;background:var(--primary);color:#fff;font-size:14px;font-family:inherit;font-weight:600;cursor:pointer;transition:.2s}
.error-state .retry-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(99,102,241,0.3)}

/* Empty state */
.empty-state{text-align:center;padding:60px 24px;grid-column:1/-1}
.empty-state i{font-size:40px;color:var(--ash);margin-bottom:16px;opacity:.4}
.empty-state h3{font-size:18px;margin-bottom:6px}
.empty-state p{font-size:13px;color:var(--ash)}

/* Footer */
.footer{text-align:center;padding:24px;font-size:12px;color:var(--ash);border-top:1px solid var(--glass)}
.footer a{color:var(--primary);text-decoration:none}
.footer a:hover{text-decoration:underline}

/* Responsive */
@media(max-width:640px){
.hero h1{font-size:24px}
.hero{padding:28px 16px 16px}
.grid{padding:0 16px 40px;grid-template-columns:1fr}
.card-details{grid-template-columns:1fr}
.header{padding:0 16px}
}
</style>
    </head>
