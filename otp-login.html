<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Login - KEYCODE Studio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --void: #030305;
      --obsidian: #0a0a0f;
      --graphite: #12121a;
      --slate: #1a1a24;
      --primary: #6366f1;
      --primary-glow: #818cf8;
      --secondary: #ec4899;
      --success: #10b981;
      --danger: #ef4444;
      --white: #ffffff;
      --ash: #d1d5db;
      --gradient-1: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
      --font-display: 'Syne', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: var(--void);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(17, 17, 23, 0.95);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 0 80px rgba(99, 102, 241, 0.15);
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo-text {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 800;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 { font-family: var(--font-display); font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .subtitle { text-align: center; color: var(--ash); font-size: 14px; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: var(--ash); margin-bottom: 8px; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--ash); }
    input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: var(--slate);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
      color: var(--white);
      font-family: 'Courier New', monospace;
      font-size: 32px;
      letter-spacing: 12px;
      text-align: center;
      transition: all 0.3s;
    }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
    .btn {
      width: 100%;
      padding: 16px;
      background: var(--gradient-1);
      border: none;
      border-radius: 12px;
      color: white;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .link { display: block; text-align: center; margin-top: 20px; color: var(--primary); text-decoration: none; font-size: 14px; }
    .link:hover { color: var(--ash); }
    .message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .message.show { display: block; }
    .message.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); }
    .message.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: var(--success); }
    .step { display: none; }
    .step.active { display: block; }
    .divider { display: flex; align-items: center; margin: 24px 0; color: var(--ash); font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
    .divider span { padding: 0 16px; }
    .timer { text-align: center; color: var(--ash); font-size: 14px; margin-top: 16px; }
    .resend-btn {
      background: transparent;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 14px;
      text-decoration: underline;
    }
    .resend-btn:disabled { color: var(--ash); cursor: not-allowed; }
    .otp-input { padding-left: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><span class="logo-text">KEYCODE</span></div>

    <!-- Step 1: Email -->
    <div class="step active" id="step1">
      <h1>Passwordless Login</h1>
      <p class="subtitle">Enter your email to receive a one-time code</p>
      <div id="message1" class="message"></div>
      <form id="emailForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="you@example.com" style="padding-left:48px;font-size:16px;letter-spacing:0;" required>
          </div>
        </div>
        <div class="form-group">
          <label for="otpAdminNo">Admin Number (optional)</label>
          <div class="input-wrapper">
            <i class="fas fa-id-card"></i>
            <input type="text" id="otpAdminNo" placeholder="KCA..." style="padding-left:48px;font-size:16px;letter-spacing:0;">
          </div>
        </div>
        <button type="submit" class="btn" id="sendBtn">Send OTP Code</button>
      </form>
      <div class="divider"><span>OR</span></div>
      <a href="login.html" class="link"><i class="fas fa-key"></i> Sign in with password</a>
    </div>

    <!-- Step 2: OTP -->
    <div class="step" id="step2">
      <h1>Enter OTP Code</h1>
      <p class="subtitle">A 6-digit code was sent to <span id="otpEmail" style="color:var(--primary);font-weight:600;"></span></p>
      <div id="message2" class="message"></div>
      <form id="otpForm">
        <div class="form-group">
          <label for="otpCode">One-Time Password</label>
          <input type="text" id="otpCode" class="otp-input" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" required>
        </div>
        <button type="submit" class="btn" id="verifyBtn">Verify & Sign In</button>
      </form>
      <div class="timer" id="otpTimer"></div>
      <button class="resend-btn" id="resendBtn" style="display:block;margin:12px auto 0;">Resend Code</button>
      <a href="#" class="link" id="backBtn" style="margin-top:16px;"><i class="fas fa-arrow-left"></i> Use different email</a>
    </div>

    <!-- Step 3: Success -->
    <div class="step" id="step3">
      <div style="text-align:center;padding:20px 0;">
        <div style="font-size:64px;color:var(--success);margin-bottom:16px;">✅</div>
        <h1>Welcome Back!</h1>
        <p class="subtitle" id="welcomeMsg">Redirecting to dashboard...</p>
        <div style="width:48px;height:48px;border:3px solid var(--graphite);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:24px auto;"></div>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    let otpEmail = '';
    let otpTimer;
    let otpCountdown = 60;

    function showStep(step) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById('step' + step).classList.add('active');
    }

    function startTimer() {
      otpCountdown = 60;
      document.getElementById('resendBtn').disabled = true;
      otpTimer = setInterval(() => {
        otpCountdown--;
        document.getElementById('otpTimer').textContent = `Resend code in ${otpCountdown}s`;
        if (otpCountdown <= 0) {
          clearInterval(otpTimer);
          document.getElementById('resendBtn').disabled = false;
          document.getElementById('otpTimer').textContent = 'Code expired? Resend below';
        }
      }, 1000);
    }

    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('message1');
      const btn = document.getElementById('sendBtn');
      msg.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      otpEmail = document.getElementById('email').value;
      const adminNo = document.getElementById('otpAdminNo').value;

      try {
        const res = await fetch('/api/auth/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: otpEmail, adminNo: adminNo || undefined })
        });
        const data = await res.json();
        if (res.ok) {
          document.getElementById('otpEmail').textContent = otpEmail;
          showStep(2);
          document.getElementById('message2').classList.remove('show');
          startTimer();
        } else {
          msg.className = 'message show error';
          msg.textContent = data.error || 'Failed to send OTP';
        }
      } catch (err) {
        msg.className = 'message show error';
        msg.textContent = 'Network error. Please try again.';
      }
      btn.disabled = false;
      btn.textContent = 'Send OTP Code';
    });

    document.getElementById('otpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('message2');
      const btn = document.getElementById('verifyBtn');
      const otp = document.getElementById('otpCode').value;
      msg.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        const res = await fetch('/api/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: otpEmail, otp })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showStep(3);
          document.getElementById('welcomeMsg').textContent = `Welcome, ${data.user.name}!`;
          setTimeout(() => window.location.href = 'control-panel.html', 1500);
        } else {
          msg.className = 'message show error';
          msg.textContent = data.error || 'Invalid OTP';
        }
      } catch (err) {
        msg.className = 'message show error';
        msg.textContent = 'Network error';
      }
      btn.disabled = false;
      btn.textContent = 'Verify & Sign In';
    });

    document.getElementById('resendBtn').addEventListener('click', () => {
      document.getElementById('emailForm').dispatchEvent(new Event('submit'));
    });

    document.getElementById('backBtn').addEventListener('click', (e) => {
      e.preventDefault();
      clearInterval(otpTimer);
      showStep(1);
    });

    // Auto-submit OTP on 6 digits
    document.getElementById('otpCode').addEventListener('input', (e) => {
      if (e.target.value.length === 6) {
        document.getElementById('otpForm').dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
