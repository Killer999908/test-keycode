<style>
:root { --void:#030305;--obsidian:#0a0a0f;--graphite:#12121a;--slate:#1a1a24;--surface:#181825;--primary:#6366f1;--primary-glow:#818cf8;--secondary:#ec4899;--accent:#22d3ee;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--white:#fff;--pearl:#e2e8f0;--ash:#94a3b8;--glass-border:rgba(255,255,255,0.06); }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--void);color:var(--pearl);min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--void)}::-webkit-scrollbar-thumb{background:var(--slate);border-radius:4px}
header{padding:16px 24px;background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--white)}
.logo i{color:var(--primary)}
.header-actions{display:flex;gap:8px;align-items:center}
.header-actions a{padding:8px 16px;border-radius:8px;font-size:12px;text-decoration:none;color:var(--ash);background:var(--slate);border:1px solid var(--glass-border);transition:.2s;display:inline-flex;align-items:center;gap:6px}
.header-actions a:hover{background:rgba(255,255,255,0.06);color:var(--white)}
.cart-icon{position:relative;padding:8px 12px;border-radius:8px;font-size:14px;color:var(--ash);background:var(--slate);border:1px solid var(--glass-border);cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.cart-icon:hover{background:rgba(255,255,255,0.06);color:var(--white)}
.cart-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:white;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
.container{max-width:1200px;margin:0 auto;padding:32px 24px}
.hero{text-align:center;padding:40px 0 48px}
.hero h1{font-size:36px;font-weight:800;margin-bottom:8px;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--ash);font-size:15px}
.filters{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.filters input{flex:1;min-width:200px;padding:10px 14px;background:var(--slate);border:1px solid var(--glass-border);border-radius:10px;color:var(--white);font-size:13px;outline:none;font-family:inherit}
.filters input:focus{border-color:var(--primary)}
.filters input::placeholder{color:rgba(255,255,255,0.2)}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.product-card{background:var(--slate);border:1px solid var(--glass-border);border-radius:14px;overflow:hidden;transition:.3s;cursor:pointer}
.product-card:hover{transform:translateY(-4px);border-color:rgba(99,102,241,0.3);box-shadow:0 12px 40px rgba(0,0,0,0.3)}
.product-img{height:180px;background:var(--graphite);display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--ash);overflow:hidden}
.product-img img{width:100%;height:100%;object-fit:cover}
.product-body{padding:16px}
.product-category{font-size:10px;text-transform:uppercase;color:var(--primary);letter-spacing:1px;font-weight:600}
.product-name{font-size:15px;font-weight:600;color:var(--white);margin:4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-price{font-size:20px;font-weight:800;color:var(--white)}
.product-price span{font-size:12px;color:var(--ash);font-weight:400}
.product-desc{font-size:12px;color:var(--ash);margin:6px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-actions{display:flex;gap:8px;margin-top:12px}
.product-actions button{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.2s;font-family:inherit}
.buy-btn{background:linear-gradient(135deg,var(--primary),var(--accent));color:white}
.buy-btn:hover{transform:translateY(-1px);opacity:.9}
.cart-btn{background:var(--graphite);border:1px solid var(--glass-border)!important;color:var(--ash)}
.cart-btn:hover{background:rgba(255,255,255,0.06);color:var(--white)}
.empty-shop{text-align:center;padding:60px 20px;color:var(--ash)}
.empty-shop i{font-size:48px;opacity:.3;margin-bottom:12px}
.empty-shop p{font-size:14px}
.empty-shop a{margin-top:12px}
.loading{text-align:center;padding:60px;color:var(--ash)}
.loading i{font-size:24px}
@media(max-width:600px){.products-grid{grid-template-columns:1fr}}

/* Cart Panel */
.cart-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:200;display:none;backdrop-filter:blur(4px)}
.cart-panel{position:fixed;top:0;right:-400px;width:400px;max-width:100vw;height:100%;background:var(--obsidian);border-left:1px solid var(--glass-border);z-index:201;transition:right .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.cart-panel.open{right:0}
.cart-header{padding:18px 20px;border-bottom:1px solid var(--glass-border);display:flex;align-items:center;justify-content:space-between}
.cart-header h3{font-size:16px;font-weight:700;color:var(--white);display:flex;align-items:center;gap:8px}
.cart-close{background:none;border:none;color:var(--ash);font-size:20px;cursor:pointer;padding:4px;transition:.2s}
.cart-close:hover{color:var(--white)}
.cart-items{flex:1;overflow-y:auto;padding:12px}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--glass-border);border-radius:10px;margin-bottom:8px}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:13px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-price{font-size:12px;color:var(--ash);margin-top:2px}
.cart-item-qty{display:flex;align-items:center;gap:6px}
.cart-item-qty button{width:26px;height:26px;border-radius:6px;border:1px solid var(--glass-border);background:var(--graphite);color:var(--ash);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:.15s;font-family:inherit}
.cart-item-qty button:hover{background:rgba(255,255,255,0.06);color:var(--white)}
.cart-item-qty span{font-size:13px;font-weight:600;color:var(--white);min-width:20px;text-align:center}
.cart-item-remove{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:4px;opacity:.6;transition:.2s}
.cart-item-remove:hover{opacity:1}
.cart-empty{text-align:center;padding:40px 20px;color:var(--ash)}
.cart-empty i{font-size:36px;opacity:.3;margin-bottom:8px}
.cart-empty p{font-size:13px}
.cart-footer{border-top:1px solid var(--glass-border);padding:16px 20px}
.cart-total{display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:var(--white);margin-bottom:12px}
.cart-checkout-btn{width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--primary),var(--accent));color:white;font-weight:600;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit}
.cart-checkout-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(99,102,241,0.3)}
.cart-checkout-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Checkout Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:300;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--obsidian);border:1px solid var(--glass-border);border-radius:16px;width:480px;max-width:90vw;max-height:90vh;overflow-y:auto;padding:28px}
.modal h3{font-size:18px;font-weight:700;color:var(--white);margin-bottom:4px}
.modal .sub{font-size:12px;color:var(--ash);margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--ash);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group textarea{width:100%;padding:10px 14px;background:var(--slate);border:1px solid var(--glass-border);border-radius:8px;color:var(--white);font-size:13px;outline:none;font-family:inherit;transition:.2s}
.form-group input:focus,.form-group textarea:focus{border-color:var(--primary)}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.btn{padding:10px 20px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.2s;display:inline-flex;align-items:center;gap:6px;font-family:inherit;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:white}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(99,102,241,0.3)}
.btn-secondary{background:var(--slate);border:1px solid var(--glass-border);color:var(--ash)}
.btn-secondary:hover{background:rgba(255,255,255,0.06);color:var(--white)}
.btn-success{background:var(--success);color:white}
.btn-sm{padding:6px 12px;font-size:11px}
.order-summary{background:var(--surface);border:1px solid var(--glass-border);border-radius:10px;padding:16px;margin:12px 0}
.summary-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;color:var(--ash)}
.summary-row.total{font-weight:700;color:var(--white);border-top:1px solid var(--glass-border);padding-top:10px;margin-top:6px}
.summary-row.total span{font-size:18px}
#stripeCard{margin:14px 0;padding:14px;background:var(--surface);border:1px solid var(--glass-border);border-radius:10px}
.checkout-result{padding:20px;text-align:center}
.checkout-result i{font-size:36px;margin-bottom:8px}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:999;background:var(--surface);border:1px solid var(--glass-border);color:var(--white);box-shadow:0 8px 30px rgba(0,0,0,0.4);animation:slideUp .3s ease}
.toast.success{border-color:var(--success)}
.toast.error{border-color:var(--danger);color:var(--danger)}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
  <link rel="stylesheet" href="/z-shared.css">
  </head>
<body>
  <div id="kc-loader">
    <div id="kc-loader-scene"></div>
      <div id="kc-bg-text" aria-hidden="true">KEYCODE</div>
<div class="kc-loader-info" style="position:absolute;bottom:48px;left:50%;transform:translateX(-50%);">
      <div id="kc-loader-bar-track"><div id="kc-loader-bar"></div></div>
      <div id="kc-loader-pct" style="font-family:'Inter',sans-serif;font-size:11px;color:#555;letter-spacing:.12em;text-align:center;">0%</div>
    </div>
  </div>

  <div id="site-nav"></div>

<header>
  <a href="/" class="logo"><i class="fas fa-bolt"></i> KEYCODE Shop</a>
  <div class="header-actions">
    <div class="cart-icon" onclick="openCart()">
      <i class="fas fa-shopping-cart"></i>
      <span class="cart-badge" id="cartBadge" style="display:none">0</span>
    </div>
    <a href="/dashboard"><i class="fas fa-store"></i> My Store</a>
    <a href="/ai-builder.html"><i class="fas fa-wand-magic-sparkles"></i> AI Builder</a>
  </div>
</header>

<div class="container">
  <div class="hero">
    <h1>KEYCODE Marketplace</h1>
    <p>AI-generated products, PCBs, 3D prints, and digital goods from our community</p>
  </div>
  <div class="filters">
    <input id="searchInput" placeholder="Search products..." oninput="renderProducts()">
  </div>
  <div class="products-grid" id="productsGrid">
    <div class="loading"><i class="fas fa-spinner fa-spin"></i><p style="margin-top:8px">Loading products...</p></div>
  </div>
</div>

<!-- Cart Panel -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h3><i class="fas fa-shopping-cart"></i> Your Cart</h3>
    <button class="cart-close" onclick="closeCart()">&times;</button>
  </div>
  <div class="cart-items" id="cartItems">
    <div class="cart-empty"><i class="fas fa-cart-plus"></i><p>Your cart is empty</p></div>
  </div>
  <div class="cart-footer" id="cartFooter" style="display:none">
    <div class="cart-total"><span>Total</span><span id="cartTotal">$0.00</span></div>
    <button class="cart-checkout-btn" onclick="openCheckout()"><i class="fas fa-bolt"></i> Checkout</button>
  </div>
</div>

<!-- Checkout Modal -->
<div class="modal-overlay" id="checkoutModal">
  <div class="modal">
    <h3><i class="fas fa-credit-card"></i> Checkout</h3>
    <p class="sub">Complete your purchase</p>
    <div class="order-summary" id="checkoutSummary"></div>
    <div class="form-row">
      <div class="form-group"><label>Name *</label><input id="coName" placeholder="Your name"></div>
      <div class="form-group"><label>Email *</label><input id="coEmail" placeholder="email@example.com"></div>
    </div>
    <div id="stripeCard"><div id="stripeElement"></div></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeCheckout()">Cancel</button>
      <button class="btn btn-primary" id="payBtn" onclick="submitCheckout()"><i class="fas fa-lock"></i> Pay $0.00</button>
    </div>
    <div id="checkoutResult"></div>
  </div>
</div>

<script>
var allProducts = [];
var cart = JSON.parse(localStorage.getItem('keycodeCart') || '[]');
var stripe = null;
var stripeElements = null;
var stripePayment = null;
var STRIPE_KEY = /*STRIPE_KEY_PLACEHOLDER*/;

// Init Stripe if key is available
if (STRIPE_KEY && !STRIPE_KEY.includes('placeholder')) {
  try {
    stripe = Stripe(STRIPE_KEY);
  } catch(e) { console.log('Stripe init failed:', e); }
}

fetch('/api/products').then(function(r){return r.json()}).then(function(data){
  if(data.success) allProducts = data.products || [];
  renderProducts();
}).catch(function(){document.getElementById('productsGrid').innerHTML='<div class="empty-shop"><i class="fas fa-exclamation-triangle"></i><p>Failed to load products</p></div>'});

function renderProducts(){
  var q = (document.getElementById('searchInput').value || '').toLowerCase();
  var filtered = allProducts.filter(function(p){return !q || p.name.toLowerCase().includes(q) || (p.description||'').toLowerCase().includes(q)});
  var grid = document.getElementById('productsGrid');
  if(!filtered.length){
    grid.innerHTML='<div class="empty-shop"><i class="fas fa-store-slash"></i><p>'+(allProducts.length?'No products match your search':'No products available yet. Be the first to list one!')+'</p><a href="/dashboard" style="display:inline-block;margin-top:12px;padding:10px 24px;background:linear-gradient(135deg,var(--primary),var(--accent));color:white;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600">Open Your Store</a></div>';
    return;
  }
  grid.textContent = '';
  filtered.forEach(function(p){
    var card = document.createElement('div'); card.className = 'product-card';
    var imgWrap = document.createElement('div'); imgWrap.className = 'product-img'; card.appendChild(imgWrap);
    if (p.image) { var im = document.createElement('img'); im.src = p.image; im.alt = p.name || 'Product'; im.width = 400; im.height = 300; im.loading = 'lazy'; imgWrap.appendChild(im); }
    else { imgWrap.innerHTML = '<i class="fas fa-cube"></i>'; }
    var body = document.createElement('div'); body.className = 'product-body'; card.appendChild(body);
    var cat = document.createElement('div'); cat.className = 'product-category'; cat.textContent = p.category || 'General'; body.appendChild(cat);
    var nm = document.createElement('div'); nm.className = 'product-name'; nm.textContent = p.name; body.appendChild(nm);
    var pr = document.createElement('div'); pr.className = 'product-price'; pr.textContent = '$' + Number(p.price).toFixed(2); body.appendChild(pr);
    var ds = document.createElement('div'); ds.className = 'product-desc'; ds.textContent = p.description || ''; body.appendChild(ds);
    var acts = document.createElement('div'); acts.className = 'product-actions'; body.appendChild(acts);
    var buy = document.createElement('button'); buy.className = 'buy-btn'; buy.textContent = 'Buy'; buy.addEventListener('click', function(e){ e.stopPropagation(); buyProduct(p.id); }); acts.appendChild(buy);
    var cartB = document.createElement('button'); cartB.className = 'cart-btn'; var inC = cart.find(function(c){return c.id===p.id}); cartB.textContent = inC ? 'In Cart ('+inC.qty+')' : 'Cart'; if (p.inventory === 0) cartB.disabled = true; cartB.addEventListener('click', function(e){ e.stopPropagation(); addToCart(p.id); }); acts.appendChild(cartB);
    grid.appendChild(card);
  });
}

function buyProduct(id){
  var p = allProducts.find(function(x){return x.id===id});
  if(!p || p.inventory === 0){ showToast('Not available','error'); return; }
  cart = [{id:p.id, name:p.name, price:p.price, qty:1, image:p.image}];
  saveCart();
  openCheckout();
}

function addToCart(id){
  var p = allProducts.find(function(x){return x.id===id});
  if(!p || p.inventory === 0){ showToast('Out of stock','error'); return; }
  var existing = cart.find(function(c){return c.id===id});
  if(existing){
    existing.qty += 1;
  } else {
    cart.push({id:p.id, name:p.name, price:p.price, qty:1, image:p.image});
  }
  saveCart();
  renderProducts();
  showToast(p.name+' added to cart','success');
}

function removeFromCart(id){
  cart = cart.filter(function(c){return c.id!==id});
  saveCart();
  renderCart();
  renderProducts();
}

function updateQty(id, delta){
  var item = cart.find(function(c){return c.id===id});
  if(!item) return;
  item.qty = Math.max(1, item.qty + delta);
  saveCart();
  renderCart();
  renderProducts();
}

function saveCart(){
  localStorage.setItem('keycodeCart', JSON.stringify(cart));
  updateBadge();
}

function updateBadge(){
  var total = cart.reduce(function(s,c){return s+c.qty}, 0);
  var badge = document.getElementById('cartBadge');
  if(total > 0){ badge.textContent = total; badge.style.display = 'block'; }
  else { badge.style.display = 'none'; }
}

function openCart(){
  renderCart();
  document.getElementById('cartOverlay').style.display = 'block';
  document.getElementById('cartPanel').classList.add('open');
}

function closeCart(){
  document.getElementById('cartOverlay').style.display = 'none';
  document.getElementById('cartPanel').classList.remove('open');
}

function renderCart(){
  var el = document.getElementById('cartItems');
  var footer = document.getElementById('cartFooter');
  if(!cart.length){
    el.innerHTML = '<div class="cart-empty"><i class="fas fa-cart-plus"></i><p>Your cart is empty</p></div>';
    footer.style.display = 'none';
    return;
  }
  footer.style.display = 'block';
  el.innerHTML = cart.map(function(c){
    var img = c.image ? '<img src="'+c.image+'" style="width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0">' : '<div style="width:40px;height:40px;border-radius:8px;background:var(--graphite);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fas fa-cube" style="color:var(--ash);font-size:16px"></i></div>';
    return '<div class="cart-item">'+img+'<div class="cart-item-info"><div class="cart-item-name">'+c.name+'</div><div class="cart-item-price">$'+Number(c.price).toFixed(2)+'</div></div><div class="cart-item-qty"><button onclick="updateQty(\''+c.id+'\',-1)">-</button><span>'+c.qty+'</span><button onclick="updateQty(\''+c.id+'\',1)">+</button></div><button class="cart-item-remove" onclick="removeFromCart(\''+c.id+'\')"><i class="fas fa-trash"></i></button></div>';
  }).join('');
  var total = cart.reduce(function(s,c){return s + c.price * c.qty}, 0);
  document.getElementById('cartTotal').textContent = '$'+total.toFixed(2);
}

function openCheckout(){
  closeCart();
  if(!cart.length){ showToast('Cart is empty','error'); return; }
  document.getElementById('checkoutResult').innerHTML = '';
  document.getElementById('payBtn').disabled = false;
  document.getElementById('payBtn').innerHTML = '<i class="fas fa-lock"></i> Pay $'+cart.reduce(function(s,c){return s+c.price*c.qty},0).toFixed(2);
  var summary = document.getElementById('checkoutSummary');
  var subtotal = cart.reduce(function(s,c){return s+c.price*c.qty}, 0);
  var tax = subtotal * 0.08;
  var total = subtotal + tax;
  summary.innerHTML = cart.map(function(c){
    return '<div class="summary-row"><span>'+c.name+' x'+c.qty+'</span><span>$'+(c.price*c.qty).toFixed(2)+'</span></div>';
  }).join('') + '<div class="summary-row"><span>Subtotal</span><span>$'+subtotal.toFixed(2)+'</span></div><div class="summary-row"><span>Tax (8%)</span><span>$'+tax.toFixed(2)+'</span></div><div class="summary-row total"><span>Total</span><span>$'+total.toFixed(2)+'</span></div>';
  document.getElementById('payBtn').innerHTML = '<i class="fas fa-lock"></i> Pay $'+total.toFixed(2);
  document.getElementById('checkoutModal').style.display = 'flex';

  // Mount Stripe Elements
  var el = document.getElementById('stripeElement');
  el.innerHTML = '';
  if(stripe){
    try {
      stripeElements = stripe.elements({ appearance: { theme: 'night', labels: 'floating', variables: { colorPrimary: '#6366f1', colorBackground: '#12121a', colorText: '#e2e8f0', fontFamily: 'Inter, sans-serif', borderRadius: '8px' } } });
      stripePayment = stripeElements.create('payment', { layout: 'tabs' });
      stripePayment.mount('#stripeElement');
    } catch(e){ el.innerHTML = '<p style="color:var(--ash);font-size:12px">Stripe unavailable. Payment will be recorded without processing.</p>'; }
  } else {
    el.innerHTML = '<p style="color:var(--ash);font-size:12px"><i class="fas fa-info-circle"></i> Test mode: order will be placed without real payment.</p>';
  }
}

function closeCheckout(){
  document.getElementById('checkoutModal').style.display = 'none';
}

async function submitCheckout(){
  var name = document.getElementById('coName').value.trim();
  var email = document.getElementById('coEmail').value.trim();
  if(!name || !email){ showToast('Name and email required','error'); return; }
  var btn = document.getElementById('payBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

  try {
    var items = cart.map(function(c){ return { productId: c.id, quantity: c.qty }; });
    var r = await fetch('/api/shop/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: items, customer: { name: name, email: email }, paymentMethodId: null })
    });
    var data = await r.json();
    if(!data.success) throw new Error(data.error || 'Checkout failed');

    document.getElementById('checkoutResult').innerHTML = '<div class="checkout-result"><i class="fas fa-check-circle" style="color:var(--success)"></i><p style="color:var(--success);font-weight:600;margin:6px 0">Order Placed!</p><p style="font-size:12px;color:var(--ash)">Order #'+data.order.id+'</p><p style="font-size:12px;color:var(--ash);margin-top:4px">Thank you, '+name+'!</p><button class="btn btn-primary btn-sm" onclick="closeCheckout()" style="margin-top:12px">Continue Shopping</button></div>';
    btn.style.display = 'none';
    cart = [];
    saveCart();
    renderProducts();
  } catch(e) {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-lock"></i> Pay $'+cart.reduce(function(s,c){return s+c.price*c.qty},0).toFixed(2);
    document.getElementById('checkoutResult').innerHTML = '<p style="color:var(--danger);font-size:12px;text-align:center;margin-top:8px">'+e.message+'</p>';
    showToast(e.message, 'error');
  }
}

function showToast(msg, type){
  var t=document.createElement('div');t.className='toast '+(type||'success');t.textContent=msg;
  document.body.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transition='.3s';setTimeout(function(){t.remove()},300)},2500);
}

updateBadge();
