<style>
:root{--bg:#0a0a1a;--card:#12122a;--primary:#ffffff;--accent:#22d3ee;--success:#10b981;--error:#ef4444;--warning:#f59e0b;--text:#e2e8f0;--ash:#94a3b8;--border:rgba(255,255,255,0.06);--radius:12px;--radius-lg:16px;--font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;overflow-x:hidden}
a{color:var(--primary);text-decoration:none}
a:hover{color:var(--accent)}
img{max-width:100%;height:auto;display:block}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px}

.container{max-width:1148px;margin:0 auto;padding:0 24px}

.navbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;max-width:1148px;margin:0 auto;border-bottom:1px solid var(--border)}
.nav-logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;color:var(--text);letter-spacing:-0.5px;text-decoration:none}
.nav-logo img{height:32px;width:auto}
.nav-links{display:flex;align-items:center;gap:4px;list-style:none}
.nav-links a{padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ash);transition:all .2s;text-decoration:none;white-space:nowrap}
.nav-links a:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.nav-links a.active{color:var(--primary);background:rgba(99,102,241,0.1)}
.nav-actions{display:flex;align-items:center;gap:12px}
.nav-toggle{display:none;background:none;border:none;color:var(--text);font-size:24px;padding:4px;cursor:pointer}
@media(max-width:768px){
  .nav-links{display:none;position:absolute;top:68px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--border);flex-direction:column;padding:12px;z-index:100}
  .nav-links.open{display:flex}
  .nav-links a{width:100%}
  .nav-toggle{display:block}
}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:none;border-radius:8px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#5558e6;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{background:rgba(255,255,255,0.04);color:var(--ash);border:1px solid var(--border)}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text)}
.btn-danger{background:rgba(239,68,68,0.15);color:var(--error);border:1px solid rgba(239,68,68,0.2)}
.btn-danger:hover{background:rgba(239,68,68,0.25)}
.btn-sm{padding:6px 12px;font-size:12px}

@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
.spinner-sm{width:14px;height:14px;border-width:2px}

.skeleton{background:linear-gradient(90deg,var(--card) 25%,rgba(255,255,255,0.04) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.hero{padding:48px 0 32px;text-align:center}
.hero h1{font-size:36px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,var(--text) 0%,var(--primary) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:16px;color:var(--ash);margin-top:8px;max-width:560px;margin-left:auto;margin-right:auto}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
@media(max-width:768px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.stats-grid{grid-template-columns:1fr}}

.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;position:relative;overflow:hidden;transition:all .2s}
.stat-card:hover{border-color:rgba(255,255,255,0.1);transform:translateY(-2px)}
.stat-card .stat-icon{font-size:22px;margin-bottom:10px;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.stat-card .stat-value{font-size:28px;font-weight:800;color:var(--text);line-height:1.2}
.stat-card .stat-label{font-size:13px;color:var(--ash);margin-top:2px}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.section-header h2{font-size:20px;font-weight:700;letter-spacing:-0.2px}
.section-header .right{display:flex;align-items:center;gap:8px}

.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:320px}
.search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ash);font-size:14px}
.search-wrap input{width:100%;padding:10px 12px 10px 36px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:all .2s}
.search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,0.15)}
.search-wrap input::placeholder{color:var(--ash)}
.filter-select{padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:var(--font);font-size:13px;outline:none;cursor:pointer;min-width:140px}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:700px}
thead{background:rgba(255,255,255,0.02)}
th{padding:14px 16px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--ash);letter-spacing:0.5px;border-bottom:1px solid var(--border)}
td{padding:14px 16px;font-size:13px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.02)}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-live{background:rgba(16,185,129,0.12);color:var(--success)}
.badge-deploying{background:rgba(245,158,11,0.12);color:var(--warning)}
.badge-failed{background:rgba(239,68,68,0.12);color:var(--error)}

.ssl-yes{color:var(--success)}
.ssl-no{color:var(--error)}

.actions-cell{display:flex;align-items:center;gap:6px}
.actions-cell a,.actions-cell button{width:32px;height:32px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;border:none;background:rgba(255,255,255,0.04);color:var(--ash);cursor:pointer;transition:all .2s;font-size:13px;text-decoration:none}
.actions-cell a:hover,.actions-cell button:hover{background:rgba(255,255,255,0.1);color:var(--text)}
.actions-cell .btn-danger-action:hover{background:rgba(239,68,68,0.15);color:var(--error)}

.empty-state{padding:60px 20px;text-align:center}
.empty-state i{font-size:48px;color:rgba(255,255,255,0.08);margin-bottom:16px}
.empty-state h3{font-size:18px;font-weight:600;margin-bottom:6px}
.empty-state p{font-size:14px;color:var(--ash);margin-bottom:16px}

.deploy-form{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-bottom:32px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:768px){.form-grid{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:13px;font-weight:600;color:var(--text)}
.form-group input,.form-group select{padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:all .2s}
.form-group input:focus,.form-group select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,0.15)}
.form-group input::placeholder{color:var(--ash)}
.domain-suggestions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.domain-suggestions button{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--ash);font-size:12px;cursor:pointer;transition:all .2s;font-family:var(--font)}
.domain-suggestions button:hover{border-color:var(--primary);color:var(--primary)}
.domain-suggestions button.active{border-color:var(--primary);background:rgba(99,102,241,0.1);color:var(--primary)}

.progress-bar-wrap{margin-top:20px;display:none}
.progress-bar-wrap.active{display:block}
.progress-steps{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:relative}
.progress-steps::before{content:'';position:absolute;top:50%;left:10px;right:10px;height:2px;background:var(--border);transform:translateY(-50%);z-index:0}
.progress-step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.progress-step .step-dot{width:28px;height:28px;border-radius:50%;background:var(--card);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ash);transition:all .3s}
.progress-step.active .step-dot{background:var(--primary);border-color:var(--primary);color:#fff}
.progress-step.done .step-dot{background:var(--success);border-color:var(--success);color:#fff}
.progress-step .step-label{font-size:11px;color:var(--ash);font-weight:500}
.progress-step.active .step-label{color:var(--primary)}
.progress-step.done .step-label{color:var(--success)}
.progress-bar{height:4px;background:var(--border);border-radius:4px;overflow:hidden}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px;transition:width .6s ease;width:0%}

.domains-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:32px}
.domain-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;align-items:center;justify-content:space-between;transition:all .2s}
.domain-card:hover{border-color:rgba(255,255,255,0.1)}
.domain-card .domain-info{display:flex;align-items:center;gap:12px}
.domain-card .domain-name{font-size:15px;font-weight:600}
.domain-card .domain-meta{font-size:12px;color:var(--ash);margin-top:2px}
.domain-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.domain-dot.active{background:var(--success);box-shadow:0 0 6px rgba(16,185,129,0.4)}
.domain-dot.pending{background:var(--warning);box-shadow:0 0 6px rgba(245,158,11,0.4)}
.domain-dot.dns{background:var(--primary);box-shadow:0 0 6px rgba(99,102,241,0.4)}

.timeline{position:relative;padding-left:28px;margin-bottom:32px}
.timeline::before{content:'';position:absolute;left:10px;top:8px;bottom:8px;width:1px;background:var(--border)}
.timeline-item{position:relative;padding:16px 20px;margin-bottom:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:flex-start;gap:14px}
.timeline-item .tl-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.timeline-item .tl-content{flex:1}
.timeline-item .tl-title{font-size:14px;font-weight:500;color:var(--text)}
.timeline-item .tl-time{font-size:12px;color:var(--ash);margin-top:2px}
.timeline-item .tl-icon.build{background:rgba(99,102,241,0.1);color:var(--primary)}
.timeline-item .tl-icon.deploy{background:rgba(16,185,129,0.1);color:var(--success)}
.timeline-item .tl-icon.ssl{background:rgba(245,158,11,0.1);color:var(--warning)}
.timeline-item .tl-icon.dns{background:rgba(34,211,238,0.1);color:var(--accent)}

.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.toast{padding:14px 20px;border-radius:10px;background:var(--card);border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,0.4);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;min-width:300px;animation:slideIn .3s ease;backdrop-filter:blur(8px)}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--error)}
.toast.info{border-left:3px solid var(--primary)}
.toast i{font-size:16px}
.toast.success i{color:var(--success)}
.toast.error i{color:var(--error)}
.toast.info i{color:var(--primary)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.footer{border-top:1px solid var(--border);padding:24px 0;margin-top:48px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.footer-links{display:flex;gap:20px;flex-wrap:wrap}
.footer-links a{font-size:13px;color:var(--ash);text-decoration:none}
.footer-links a:hover{color:var(--text)}
.footer-copy{font-size:13px;color:var(--ash)}

@media(max-width:768px){
  .hero h1{font-size:28px}
  .footer{flex-direction:column;text-align:center}
  .toast{min-width:auto;width:calc(100vw - 40px)}
}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;max-width:420px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,0.5)}
.modal h3{font-size:18px;font-weight:600;margin-bottom:8px}
.modal p{font-size:14px;color:var(--ash);margin-bottom:20px;line-height:1.5}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
</style>

</head>
<div id="site-footer"></div>

<script src="/js/site.js"></script>
