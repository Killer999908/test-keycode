<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - KEYCODE Studio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #030305;
      --primary: #6366f1;
      --white: #ffffff;
      --ash: #d1d5db;
      --gradient-1: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
      --font-display: 'Syne', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: var(--void);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card { text-align: center; }
    .error-code {
      font-family: var(--font-display);
      font-size: 160px;
      font-weight: 900;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 { font-family: var(--font-display); font-size: 28px; font-weight: 700; margin-bottom: 12px; }
    p { color: var(--ash); margin-bottom: 32px; font-size: 16px; }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: var(--gradient-1);
      border: none;
      border-radius: 12px;
      color: white;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4); }
  </style>
</head>
<body>
  <div class="card">
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn"><i class="fas fa-home"></i> Go Home</a>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
</body>
</html>
