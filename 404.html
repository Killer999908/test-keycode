<!DOCTYPE html>
<html lang="en" data-kc-theme data-kc-error>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — KEYCODE</title>
  <meta name="description" content="Page not found">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a; color: #fff;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 20px 40px;
    }
    .kc-404 { text-align: center; max-width: 480px; }
    .kc-404-code {
      font-family: 'Syne', sans-serif;
      font-size: clamp(100px, 20vw, 160px);
      font-weight: 900; color: #fff;
      line-height: 1; margin-bottom: 8px;
    }
    .kc-404-code span { color: rgba(255,255,255,0.3); }
    .kc-404 h1 {
      font-family: 'Syne', sans-serif;
      font-size: 18px; font-weight: 700; margin-bottom: 12px;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .kc-404 p {
      color: rgba(255,255,255,0.4);
      margin-bottom: 40px; font-size: 14px; line-height: 1.6;
    }
    .kc-404 a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 32px;
      background: #fff; color: #000;
      border: 1px solid #fff;
      font-family: 'Syne', sans-serif;
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s;
      border-radius: 999px;
    }
    .kc-404 a:hover { background: transparent; color: #fff; }
  </style>
  <link rel="stylesheet" href="/theme.css">
  <script defer src="/theme.js"></script>
</head>
<body>
  <div class="kc-404">
    <div class="kc-404-code">4<span>0</span>4</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">← Back Home</a>
  </div>
</body>
</html>
