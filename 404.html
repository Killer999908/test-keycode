<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost in space — KEYCODE Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080a; --ink:#fafafa; --dim:#a1a1aa; --faint:#71717a;
  --border:rgba(255,255,255,.07); --border-hi:rgba(255,255,255,.18);
  --font:'Space Grotesk',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;overflow-x:hidden}
.bg-grad{position:fixed;inset:0;background:radial-gradient(ellipse 80% 55% at 50% -10%,rgba(139,92,246,.16),transparent 60%),radial-gradient(ellipse 60% 45% at 85% 100%,rgba(34,211,238,.08),transparent 60%);pointer-events:none}
.bg-grid{position:fixed;inset:0;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 75% 70% at 50% 30%,#000 20%,transparent 100%);pointer-events:none}
.stage{flex:1;display:grid;place-items:center;padding:2rem;position:relative;z-index:1}
.core{text-align:center;max-width:680px}
.big404{
  font-size:clamp(7rem,26vw,17rem);font-weight:700;line-height:.8;letter-spacing:-.05em;
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.015));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  user-select:none;animation:rise 1s cubic-bezier(.16,1,.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
.core h1{font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:600;letter-spacing:-.02em;margin:1.6rem 0 .7rem;animation:rise .9s .1s cubic-bezier(.16,1,.3,1) both}
.core p{color:var(--dim);font-size:1rem;line-height:1.6;max-width:46ch;margin:0 auto 2.2rem;animation:rise .9s .18s cubic-bezier(.16,1,.3,1) both}
.cmd{
  display:flex;align-items:center;gap:.7rem;max-width:440px;margin:0 auto 2.4rem;
  padding:.85rem 1.1rem;border:1px solid var(--border-hi);border-radius:999px;
  background:rgba(255,255,255,.03);animation:rise .9s .26s cubic-bezier(.16,1,.3,1) both;
}
.cmd kbd{font:500 .68rem/1 var(--mono);color:var(--faint);border:1px solid var(--border);border-radius:6px;padding:3px 8px;white-space:nowrap}
.cmd input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font:500 .95rem/1 var(--font)}
.cmd input::placeholder{color:var(--faint)}
.links{display:flex;gap:1.6rem;justify-content:center;flex-wrap:wrap;animation:rise .9s .34s cubic-bezier(.16,1,.3,1) both}
.links a{color:var(--dim);text-decoration:none;font-size:.92rem;padding-bottom:.3rem;border-bottom:1px solid var(--border-hi);transition:color .2s,border-color .2s}
.links a:hover{color:var(--ink);border-color:#fff}
.wordmark{
  margin-top:4rem;font-weight:700;letter-spacing:-.02em;line-height:.8;user-select:none;
  font-size:clamp(4rem,15vw,12rem);
  background:linear-gradient(180deg,rgba(255,255,255,.13),transparent 80%);
  -webkit-background-clip:text;background-clip:text;color:transparent;position:relative;
  animation:rise 1.2s .4s cubic-bezier(.16,1,.3,1) both;
}
.beam{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.beam::after{
  content:'';position:absolute;top:-20%;left:-30%;width:36%;height:140%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.05),transparent);
  transform:rotate(12deg);animation:beam 5.5s ease-in-out infinite;
}
@keyframes beam{0%,55%{left:-35%}85%,100%{left:125%}}
footer{padding:1.6rem;text-align:center;font:400 .68rem/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg-grad"></div>
<div class="bg-grid"></div>

<div class="stage">
  <div class="core">
    <div class="big404">404</div>
    <h1>Lost in space.</h1>
    <p>This page drifted out of orbit — or never launched. The way back is one keystroke away.</p>
    <div class="cmd">
      <kbd>⌘K</kbd>
      <input id="q" type="text" placeholder="Ask for a destination…" aria-label="Search destination">
    </div>
    <div class="links">
      <a href="/">Home</a>
      <a href="/ai-builder.html">AI Builder</a>
      <a href="/gallery.html">Works</a>
      <a href="/pricing.html">Pricing</a>
    </div>
  </div>

  <div class="wordmark-wrap" style="position:relative;text-align:center">
    <div class="wordmark">KEYCODE<div class="beam"></div></div>
  </div>
</div>

<footer>ERROR 404 · SIGNAL LOST · <a href="/status.html" style="color:inherit">STATUS</a></footer>
<script>
(function(){
  var input=document.getElementById('q');
  var routes=[['home','/'],['builder','/ai-builder.html'],['ai','/ai-builder.html'],['game','/ai-builder.html?mode=game'],['cad','/ai-builder.html?mode=cad'],['pcb','/ai-builder.html?mode=pcb'],['works','/gallery.html'],['gallery','/gallery.html'],['pricing','/pricing.html'],['docs','/docs.html'],['login','/login.html'],['signup','/register.html'],['status','/status.html'],['dashboard','/dashboard.html']];
  function go(){
    var q=input.value.trim().toLowerCase();
    if(!q){location.href='/';return}
    var best=null,score=0;
    routes.forEach(function(r){var s=0;if(r[0]===q)s=100;else if(r[0].indexOf(q)===0)s=60;else if(r[0].indexOf(q)>=0)s=30;if(s>score){score=s;best=r[1]}});
    location.href=best||'/';
  }
  input.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  document.addEventListener('keydown',function(e){
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();input.focus()}
  });
})();
</script>
</body>
</html>
