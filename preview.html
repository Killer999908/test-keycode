<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --void: #050508; --obsidian: #0a0a0f; --graphite: #111117; --slate: #1a1a24;
  --primary: #ffffff; --primary-glow: rgba(99,102,241,0.3); --primary-deep: #4f46e5;
  --secondary: #a3a3a3; --accent: #06b6d4; --success: #22c55e; --danger: #ef4444;
  --white: #ffffff; --ivory: #f1f5f9; --pearl: #e2e8f0; --silver: #94a3b8; --ash: #64748b;
  --font-display: 'Syne', sans-serif; --font-body: 'Inter', sans-serif;
}
body { font-family: var(--font-body); background: var(--void); color: var(--white); min-height: 100vh; display: flex; flex-direction: column; }
.header {
  background: var(--graphite); border-bottom: 1px solid var(--slate); padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 12px; flex-wrap: wrap;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-left h1 { font-family: var(--font-display); font-size: 16px; background: linear-gradient(135deg,var(--primary),var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.back-btn { color: var(--silver); text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.back-btn:hover { color: var(--white); }
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctrl-btn {
  padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--slate); background: var(--obsidian); color: var(--silver);
  transition: all 0.2s; font-family: var(--font-body); display: flex; align-items: center; gap: 5px;
}
.ctrl-btn:hover { border-color: var(--primary); color: var(--white); background: rgba(99,102,241,0.1); }
.ctrl-btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
.ctrl-btn.primary:hover { background: var(--primary-deep); box-shadow: 0 0 16px var(--primary-glow); }
.ctrl-btn.active { border-color: var(--accent); color: var(--accent); }
.ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.stats { display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--ash); }
.stats span { display: flex; align-items: center; gap: 4px; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.iframe-wrap { flex: 1; position: relative; overflow: hidden; }
.iframe-wrap iframe { width: 100%; height: 100%; border: none; background: white; }
#previewFrame { transition: all 0.3s; }
#previewFrame.tablet { max-width: 768px; margin: 0 auto; border-left: 1px solid var(--slate); border-right: 1px solid var(--slate); }
#previewFrame.mobile { max-width: 375px; margin: 0 auto; border-left: 1px solid var(--slate); border-right: 1px solid var(--slate); }
.state-overlay {
  position: absolute; inset: 0; background: var(--void);
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; z-index: 10;
}
.state-overlay i { font-size: 48px; opacity: 0.3; }
.state-overlay p { font-size: 14px; color: var(--ash); max-width: 360px; text-align: center; }
.state-overlay .spinner { width: 32px; height: 32px; border: 3px solid var(--slate); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.state-overlay .error-icon { color: var(--danger); opacity: 0.8; }
.toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 10px 16px; border-radius: 8px; font-size: 12px; background: var(--graphite);
  border: 1px solid var(--slate); color: var(--white); animation: slideIn 0.3s ease;
  display: flex; align-items: center; gap: 8px; min-width: 240px;
}
.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }
.toast i { font-size: 14px; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@media (max-width: 640px) {
  .header { padding: 10px 12px; }
  .header-left h1 { font-size: 14px; }
  .controls { width: 100%; justify-content: flex-start; }
  .stats { width: 100%; justify-content: flex-start; }
}
</style>

<body>
  <div id="kc-loader">
    <div id="kc-loader-scene"></div>
      <div id="kc-bg-text" aria-hidden="true">KEYCODE</div>
<div class="kc-loader-info" style="position:absolute;bottom:48px;left:50%;transform:translateX(-50%);">
      <div id="kc-loader-bar-track"><div id="kc-loader-bar"></div></div>
      <div id="kc-loader-pct" style="font-family:'Inter',sans-serif;font-size:11px;color:#555;letter-spacing:.12em;text-align:center;">0%</div>
    </div>
  </div>

<div class="header">
  <div class="header-left">
    <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
    <h1><i class="fas fa-globe"></i> Live Preview</h1>
  </div>
  <div class="controls">
    <button class="ctrl-btn" onclick="refreshPreview()" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
    <button class="ctrl-btn" onclick="openNewTab()" id="newTabBtn"><i class="fas fa-external-link-alt"></i> Open</button>
    <button class="ctrl-btn" onclick="copyCode()" id="copyBtn"><i class="fas fa-copy"></i> Copy Code</button>
    <button class="ctrl-btn" onclick="setDevice('desktop')" id="devDesktop"><i class="fas fa-desktop"></i></button>
    <button class="ctrl-btn" onclick="setDevice('tablet')" id="devTablet"><i class="fas fa-tablet-alt"></i></button>
    <button class="ctrl-btn" onclick="setDevice('mobile')" id="devMobile"><i class="fas fa-mobile-alt"></i></button>
  </div>
  <div class="stats" id="statsBar">
    <span><i class="fas fa-file"></i> <span id="fileCount">0</span> files</span>
    <span><i class="fas fa-database"></i> <span id="totalSize">0 B</span></span>
  </div>
</div>

<div class="main" id="mainContainer">
  <div class="state-overlay" id="stateLoading">
    <div class="spinner"></div>
    <p>Loading preview...</p>
  </div>
  <div class="state-overlay" id="stateError" style="display:none">
    <i class="fas fa-exclamation-triangle error-icon"></i>
    <p id="errorMsg">Failed to load preview</p>
    <button class="ctrl-btn primary" onclick="init()"><i class="fas fa-redo"></i> Retry</button>
  </div>
  <div class="state-overlay" id="stateNoId" style="display:none">
    <i class="fas fa-link"></i>
    <p>No file ID provided. Add <code>?id=your_file_id</code> to the URL.</p>
  </div>
  <div class="iframe-wrap" id="iframeWrap" style="display:none">
    <iframe id="previewFrame" sandbox="allow-scripts" loading="lazy"></iframe>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
function getToken() { return localStorage.getItem('token') || localStorage.getItem('keycode_token') || ''; }

function showToast(msg, type) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${msg}`;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3500);
}

let currentHtml = '';
let currentFiles = {};
let currentFileId = '';
let rawData = null;

function showState(id) {
  ['stateLoading','stateError','stateNoId'].forEach(s => document.getElementById(s).style.display = s === id ? 'flex' : 'none');
  document.getElementById('iframeWrap').style.display = id === null ? 'block' : 'none';
}

function init() {
  const params = new URLSearchParams(window.location.search);
  const fileId = params.get('id');
  if (!fileId) { showState('stateNoId'); return; }
  currentFileId = fileId;
  document.getElementById('refreshBtn').disabled = true;
  document.getElementById('newTabBtn').disabled = true;
  document.getElementById('copyBtn').disabled = true;
  showState('stateLoading');
  fetchPreview(fileId);
}

async function fetchPreview(fileId) {
  try {
    const res = await fetch('/api/ai/download/' + fileId, {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    if (!res.ok) throw new Error('Server returned ' + res.status);
    const data = await res.json();
    rawData = data;
    renderPreview(data);
  } catch (e) {
    document.getElementById('errorMsg').textContent = e.message || 'Failed to load preview';
    showState('stateError');
  }
}

function renderPreview(data) {
  const html = extractHtml(data);
  if (!html) {
    document.getElementById('errorMsg').textContent = 'No HTML content found in project data';
    showState('stateError');
    return;
  }
  currentHtml = html;
  currentFiles = data.files || {};

  const frame = document.getElementById('previewFrame');
  frame.src = 'data:text/html;charset=utf-8,' + encodeURIComponent(html);

  document.getElementById('refreshBtn').disabled = false;
  document.getElementById('newTabBtn').disabled = false;
  document.getElementById('copyBtn').disabled = false;

  updateStats(data);

  showState(null);
  showToast('Preview loaded', 'success');
}

function extractHtml(data) {
  if (!data) return null;
  if (data.html) return data.html;
  if (data['index.html']) return data['index.html'];
  if (data.files) {
    if (typeof data.files === 'object' && data.files['index.html']) return data.files['index.html'];
    if (Array.isArray(data.files)) {
      for (const key of ['index.html', 'index.htm', 'default.html']) {
        if (data[key]) return data[key];
      }
    }
  }
  for (const key of Object.keys(data)) {
    if (key.endsWith('.html') || key.endsWith('.htm')) return data[key];
  }
  return null;
}

function updateStats(data) {
  const fileList = data.files || [];
  let count = 0;
  let totalSize = 0;
  if (Array.isArray(fileList)) {
    count = fileList.length;
  } else if (typeof fileList === 'object') {
    const keys = Object.keys(fileList);
    count = keys.length;
    keys.forEach(k => {
      if (typeof fileList[k] === 'string') totalSize += new Blob([fileList[k]]).size;
    });
  }
  if (data.fileCount) count = data.fileCount;
  if (data.html) {
    if (!count) count = 1;
    if (!totalSize) totalSize += new Blob([data.html]).size;
  }
  document.getElementById('fileCount').textContent = count;
  document.getElementById('totalSize').textContent = formatSize(totalSize);
}

function formatSize(bytes) {
  if (!bytes) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  let size = bytes;
  while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
  return size.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
}

function refreshPreview() {
  if (currentFileId) {
    document.getElementById('refreshBtn').disabled = true;
    showState('stateLoading');
    fetchPreview(currentFileId);
  }
}

function openNewTab() {
  if (currentHtml) {
    const w = window.open();
    w.document.write(currentHtml);
    w.document.close();
  }
}

function copyCode() {
  if (!currentHtml) return;
  navigator.clipboard.writeText(currentHtml).then(() => {
    showToast('Code copied to clipboard', 'success');
  }).catch(() => {
    showToast('Failed to copy code', 'error');
  });
}

let currentDevice = 'desktop';

function setDevice(device) {
  currentDevice = device;
  const frame = document.getElementById('previewFrame');
  frame.className = device === 'desktop' ? '' : device;
  document.querySelectorAll('[id^="dev"]').forEach(b => b.classList.remove('active'));
  const map = { desktop: 'devDesktop', tablet: 'devTablet', mobile: 'devMobile' };
  const btn = document.getElementById(map[device]);
  if (btn) btn.classList.add('active');
}

init();
</script>
