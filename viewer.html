<style>
:root {
  --bg: #0a0a12;
  --surface: rgba(26,26,46,0.9);
  --primary: #ffffff; --secondary: #22d3ee; --accent: #f59e0b;
  --text: #e2e8f0; --ash: #94a3b8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  overflow: hidden;
  height: 100vh;
}
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 12px 24px;
  background: rgba(10,10,18,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(99,102,241,0.2);
  display: flex;
  align-items: center;
  gap: 16px;
  z-index: 100;
}
nav img { height: 32px; }
nav h1 { font-size: 16px; font-weight: 600; flex: 1; }
nav a {
  color: var(--ash);
  text-decoration: none;
  font-size: 14px;
  padding: 8px 16px;
  border-radius: 8px;
  transition: all 0.3s;
}
nav a:hover { background: rgba(99,102,241,0.2); color: white; }
#canvas-container {
  width: 100vw;
  height: 100vh;
  display: block;
}
.controls-hint {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid rgba(99,102,241,0.3);
  border-radius: 12px;
  padding: 10px 20px;
  font-size: 13px;
  color: var(--ash);
  display: flex;
  gap: 20px;
  backdrop-filter: blur(8px);
  z-index: 50;
}
.controls-hint span { display: flex; align-items: center; gap: 6px; }
.controls-hint i { color: var(--primary); }
.loading-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 200;
  transition: opacity 0.5s;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 48px; height: 48px;
  border: 3px solid rgba(99,102,241,0.2);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay p { margin-top: 16px; color: var(--ash); font-size: 14px; }
.error-msg {
  position: fixed;
  top: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(239,68,68,0.2);
  border: 1px solid #ef4444;
  border-radius: 12px;
  padding: 12px 24px;
  color: #ef4444;
  font-size: 14px;
  display: none;
  z-index: 100;
}
</style>
    </head>
<body>
  <div id="kc-loader">
    <div id="kc-loader-scene"></div>
      <div id="kc-bg-text" aria-hidden="true">KEYCODE</div>
<div class="kc-loader-info" style="position:absolute;bottom:48px;left:50%;transform:translateX(-50%);">
      <div id="kc-loader-bar-track"><div id="kc-loader-bar"></div></div>
      <div id="kc-loader-pct" style="font-family:'Inter',sans-serif;font-size:11px;color:#555;letter-spacing:.12em;text-align:center;">0%</div>
    </div>
  </div>

<nav>
  <img src="/assets/logo-nav-XDdIguVL.png" alt="KEYCODE" loading="lazy">
  <h1>3D Viewer</h1>
  <a href="control-panel.html"><i class="fas fa-arrow-left"></i> Back</a>
</nav>

<div class="error-msg" id="errorMsg"></div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p>Loading 3D model...</p>
</div>

<div id="canvas-container"></div>

<div class="controls-hint">
  <span><i class="fas fa-mouse-pointer"></i> Rotate</span>
  <span><i class="fas fa-scroll"></i> Zoom</span>
  <span><i class="fas fa-arrows-alt"></i> Pan (right-click)</span>
</div>

<script src="/js/scroll-3d-animations.js"></script>  <script src="/js/k-scroll.js" defer></script>

<script src="/js/site.js"></script>
